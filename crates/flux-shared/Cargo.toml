[package]
name = "flux-shared"
version = "0.1.0"
edition.workspace = true

[dependencies]
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2 = "0.10"
# IYUU 客户端：签名用 sha1，出站用 reqwest（与 api 同版本同特性）
