<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FluxTorrent · 山海经左侧图鉴菜单（可交互实现）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233fae8f'/%3E%3Cpath d='M7 12l3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Serif SC","Songti SC","SimSun",serif;background:#16181d;color:#e8e4d6;line-height:1.55;padding:26px 20px 60px}
.wrap{max-width:1200px;margin:0 auto}
.head{text-align:center;margin-bottom:8px}
.head h1{font-family:"Ma Shan Zheng",serif;font-size:28px;letter-spacing:4px;color:#f0d795;font-weight:400}
.head p{font-size:12.5px;color:#9aa697;margin-top:8px;letter-spacing:1px}
.hint{text-align:center;font-size:12px;color:#6a7a6a;margin-bottom:22px}
.hint b{color:#d3a13f;font-weight:600}

.two{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
@media(max-width:960px){.two{grid-template-columns:1fr}}
.panel-cap{text-align:center;font-size:12px;letter-spacing:3px;color:#9aa697;margin-bottom:10px}
.panel-cap b{color:#f0d795;font-weight:600}

/* ===== 两档 token（对齐 theme-shanhaijing.css） ===== */
.shj{position:relative;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;min-height:600px;box-shadow:0 18px 50px rgba(0,0,0,.5);transition:width .25s}
.shj-dark{
  --nav-bg:linear-gradient(180deg,#0d1410,#101a14 60%,#0c130e);
  --text-strong:#f4eedd; --text-muted:#b7c0ad; --text-faint:#9aa697;
  --sun:#d3a13f; --seal-a:#d0442a; --seal-b:#a82e1c; --seal-on:#ece4cf;
  --hover-bg:rgba(63,174,143,.10); --on-bg:linear-gradient(135deg,rgba(208,68,42,.28),rgba(208,68,42,.12)); --on-line:rgba(208,68,42,.5);
  --realm-bg:linear-gradient(135deg,rgba(46,122,140,.2),rgba(63,174,143,.08)); --realm-line:rgba(63,174,143,.3);
  --border-deep:rgba(211,161,63,.26); --border-soft:rgba(211,161,63,.13); --line-soft:rgba(211,161,63,.09);
  --hover-line:rgba(63,174,143,.25);
  color:#f4eedd;
}
.shj-light{
  --nav-bg:linear-gradient(180deg,#f4efdf,#efe8d3 60%,#ede5cd);
  --text-strong:#232d27; --text-muted:#55605a; --text-faint:#6a746d;
  --sun:#b07f1e; --seal-a:#c1512f; --seal-b:#9c3a20; --seal-on:#faf6ec;
  --hover-bg:rgba(44,122,100,.08); --on-bg:linear-gradient(135deg,rgba(193,81,47,.14),rgba(193,81,47,.06)); --on-line:rgba(193,81,47,.38);
  --realm-bg:linear-gradient(135deg,rgba(46,122,140,.12),rgba(44,122,100,.05)); --realm-line:rgba(44,122,100,.26);
  --border-deep:rgba(138,106,28,.34); --border-soft:rgba(138,106,28,.22); --line-soft:rgba(138,106,28,.14);
  --hover-line:rgba(44,122,100,.22);
  color:#232d27;
}
.shj{background:var(--nav-bg);border:1px solid var(--border-deep)}
.shj::after{content:"";position:absolute;top:0;right:-1px;bottom:0;width:2px;background:linear-gradient(180deg,transparent,var(--sun) 30%,var(--sun) 70%,transparent);opacity:.4;pointer-events:none}

.brand{display:flex;align-items:center;gap:12px;padding:18px 16px 14px;border-bottom:1px solid var(--border-soft)}
.brand .seal{width:46px;height:46px;flex:none;border-radius:8px;background:linear-gradient(145deg,var(--seal-a),var(--seal-b));box-shadow:0 4px 14px rgba(208,68,42,.4),inset 0 0 0 2px rgba(236,228,207,.35);color:var(--seal-on);font-family:"Ma Shan Zheng",serif;font-size:20px;transform:rotate(-3deg);display:flex;align-items:center;justify-content:center}
.brand b{display:block;font-family:"Ma Shan Zheng",serif;font-size:19px;letter-spacing:2px;font-weight:400;background:linear-gradient(180deg,#f0d795,#d3a13f 60%,#8a6a1c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.shj-light .brand b{background:linear-gradient(180deg,#d3a13f,#b07f1e 60%,#8a6a1c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand i{display:block;font-size:10px;font-style:normal;letter-spacing:3px;color:var(--text-faint);margin-top:2px}

.scroll{flex:1;padding:10px 10px 16px;overflow:hidden}
.ul{list-style:none;display:flex;flex-direction:column;gap:2px;margin:0;padding:0}
.item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text-muted);font-size:13.5px;cursor:pointer;font-family:inherit;text-align:left;transition:background .18s,color .18s,transform .18s}
.item .ico{width:20px;flex:none;font-size:14px;text-align:center}
.item:hover{background:var(--hover-bg);border-color:var(--hover-line);color:var(--text-strong);transform:translateX(2px)}
.item.cur{background:var(--on-bg);border-color:var(--on-line);box-shadow:inset 3px 0 0 var(--seal-a);color:var(--text-strong)}
.item .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .arr{color:var(--text-faint);font-size:12px;flex:none}
.item .num{width:22px;height:22px;flex:none;border-radius:4px;background:rgba(211,161,63,.15);color:var(--sun);font-size:10px;display:flex;align-items:center;justify-content:center;font-family:monospace}

.edubtn{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 4px);margin:2px 2px;padding:6px 10px;border-radius:4px;background:none;border:1px dashed var(--border-deep);color:var(--sun);font-family:"ZCOOL XiaoWei",serif;font-size:12px;letter-spacing:1px;cursor:pointer}
.edubtn:hover{background:var(--hover-bg)}

.grp{margin-top:10px}
.gtitle{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:none;color:var(--sun);cursor:pointer;font-family:"ZCOOL XiaoWei",serif;font-size:12.5px;letter-spacing:2px}
.gname{white-space:nowrap}
.gline{flex:1;height:1px;background:linear-gradient(90deg,var(--border-deep),transparent)}
.gcaret{color:var(--text-faint);font-size:9px;transition:transform .25s}
.grp.is-closed .gcaret{transform:rotate(-90deg)}
.grp .glist{overflow:hidden;transition:max-height .25s,opacity .2s;max-height:600px;opacity:1}
.grp.is-closed .glist{max-height:0;opacity:0}

/* 钻取返回行 */
.drillback{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;border-radius:4px;background:none;color:var(--sun);cursor:pointer;font-family:"ZCOOL XiaoWei",serif;font-size:12.5px;letter-spacing:1px;text-align:left}
.drillback b{margin-left:auto;color:var(--text-muted);font-weight:400;font-size:11.5px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drillback:hover{background:var(--hover-bg)}

.foot{display:flex;flex-direction:column;gap:8px;padding:12px;border-top:1px solid var(--border-soft)}
.realm{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--realm-line);border-radius:6px;background:var(--realm-bg);text-decoration:none;color:inherit;cursor:pointer}
.realm .rseal{width:34px;height:34px;flex:none;border-radius:6px;background:linear-gradient(145deg,var(--seal-a),var(--seal-b));color:var(--seal-on);font-family:"Ma Shan Zheng",serif;font-size:15px;transform:rotate(-3deg);display:flex;align-items:center;justify-content:center}
.realm b{display:block;font-family:"ZCOOL XiaoWei",serif;font-size:13px;font-weight:400}
.realm i{display:block;color:var(--sun);font-size:10.5px;font-style:normal;letter-spacing:1px;margin-top:2px}
.utilbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px;border:1px solid var(--border-soft);border-radius:4px;background:none;color:var(--text-faint);font-size:12px;cursor:pointer}
.utilbtn:hover{border-color:var(--border-deep);background:var(--hover-bg);color:var(--text-muted)}

/* 轨态 64px：文字视觉隐藏、图标居中 */
.shj.is-rail{width:64px}
.shj.is-rail .brandtext, .shj.is-rail .lab, .shj.is-rail .gname, .shj.is-rail .rtext, .shj.is-rail .foldtext,
.shj.is-rail .edubtn, .shj.is-rail .gline, .shj.is-rail .arr, .shj.is-rail .num, .shj.is-rail .drillback b, .shj.is-rail .drillback span:nth-child(2){
  position:absolute;overflow:hidden;width:1px;height:1px;clip:rect(0 0 0 0);white-space:nowrap}
.shj.is-rail .item, .shj.is-rail .gtitle{justify-content:center;padding-left:0;padding-right:0}
.shj.is-rail .brand{justify-content:center;padding:14px 6px 12px}
.shj.is-rail .brand .seal{width:38px;height:38px;font-size:16px}
.shj.is-rail .realm{justify-content:center;padding:6px}
.shj.is-rail .foot{padding:8px 6px}
.shj.is-rail .gcaret{display:none}

/* 顶部状态条 */
.statusbar{margin:0 auto 20px;max-width:640px;text-align:center;font-size:12px;color:#9aa697;background:#20261e;border:1px dashed #4a5a3a;border-radius:8px;padding:8px 14px}
.statusbar b{color:#e8c06a;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>山海经 · 左侧图鉴菜单（可交互实现）</h1>
    <p>对齐 shj-atlas.tsx / shj-atlas-edu.tsx / theme-shanhaijing.css</p>
  </div>
  <div class="hint">可点：<b>金色分组</b>折叠 · <b>教育资源「浏览 ›」</b>逐级下探（学段→年级→科目）· <b>底部换肤钮</b>切玄墨/宣纸 · <b>折叠钮</b>236↔64 轨态</div>

  <div class="statusbar" id="statusbar">当前：主菜单（一级列表）</div>

  <div class="two" id="two">
    <!-- 由 JS 渲染两个独立状态的 aside -->
  </div>

</div>

<script>
/* ===== 真实数据（对齐 lib/nav-menu.ts + nav-edu.ts，逐字中文） ===== */
const PRIMARY = [
  { href:"/",      ico:"🏠", lab:"首页" },
  { href:"/torrents", ico:"📚", lab:"资源库" },
  { href:"/edu",   ico:"📖", lab:"教育资源", edu:true },
  { href:"/forums",ico:"💬", lab:"论坛" },
  { href:"/upload",ico:"📤", lab:"发布" },
];
/* 教育四级：学段 → 年级 → 科目 */
const EDU = [
  { lab:"幼儿园", leaf:true },
  { lab:"小学", items:[
      { lab:"全部小学", leaf:true },
      { lab:"一年级" },{ lab:"二年级" },
      { lab:"三年级", subs:["数学","语文","英语","物理","化学","生物","政治","历史","地理"] },
      { lab:"四年级" },{ lab:"五年级" },{ lab:"六年级" },
  ]},
  { lab:"初中", items:[
      { lab:"全部初中", leaf:true },
      { lab:"初一" },{ lab:"初二" },{ lab:"初三" },
  ]},
  { lab:"高中", items:[
      { lab:"全部高中", leaf:true },
      { lab:"高一" },{ lab:"高二" },{ lab:"高三" },
  ]},
  { lab:"大学", leaf:true },
];
const GROUPS = [
  { name:"资源发现", items:[["🏆","排行"],["🏅","官种"],["🙏","求种"],["🎁","候选"],["📡","出品方"],["🎤","艺人"],["🌸","当季新番"]] },
  { name:"字幕与保种", items:[["📑","字幕"],["👥","字幕组"],["🛡️","保种区"],["🆘","濒危预警"],["🤝","保种协作"],["📖","课本"]] },
  { name:"魔力经济", items:[["🛒","商店"],["🏦","魔力银行"],["🔮","站免池"],["✅","任务"],["✨","我的魔力"],["📒","魔力明细"]] },
  { name:"成长荣誉", items:[["🎓","等级要求"],["📝","我的考核"],["🏅","成就墙"],["💫","复活任务"],["🎖️","勋章墙"],["🖼️","头像挂件"],["🏵️","我的勋章"],["📊","绩效"],["✉️","邀请"]] },
  { name:"娱乐", items:[["🎮","娱乐屋"],["🥚","抽卡屋"],["🌾","农场"],["⚫","五子棋"],["🏁","大赛"],["🧑‍🤝‍🧑","社交"]] },
  { name:"更多", items:[["📨","消息"],["⚖️","我的H&R"],["📺","追更中心"],["❓","FAQ"],["🧭","客户端指南"],["📔","Wiki"],["💝","捐赠"]] },
];

/* 每个 aside 独立状态 */
function newState(theme){
  return {
    theme,                 // 'dark' | 'light'
    rail:false,
    closed:{},              // 分组折叠 key=组名
    /* 教育钻取 cursor：null=主菜单；{stage:-1}=学段页；{stage,grade:null}=年级页；{stage,grade}=科目页 */
    edu:null,
    active:"/edu",
  };
}

function itemHTML(it, cur){
  return `<button class="item ${cur?'cur':''}" data-act="nav" data-href="${it.href||it.lab}">
    ${it.ico?`<span class="ico">${it.ico}</span>`:''}
    ${it.num?`<span class="num">${it.num}</span>`:''}
    <span class="lab">${it.lab}</span>
  </button>`;
}

/* 渲染单个 aside 的 nav 区 HTML */
function navHTML(s){
  /* 教育钻取视图 */
  if(s.edu){
    const c = s.edu;
    /* 科目页 */
    if(c.stage>=0 && c.grade!=null){
      const stage = EDU[c.stage];
      const grade = stage.items[c.grade];
      let rows = `<button class="drillback" data-act="back-grade"><span>‹ 返回</span><b>${stage.lab} · ${grade.lab}</b></button>`;
      rows += `<div class="ul">`;
      rows += itemHTML({lab:grade.lab+"全部科目"}, true);
      (grade.subs||[]).forEach((sub,i)=>{
        rows += itemHTML({num:String(i+1).padStart(2,"0"), lab:sub});
      });
      rows += `</div>`;
      return rows;
    }
    /* 年级页 */
    if(c.stage>=0 && c.grade==null){
      const stage = EDU[c.stage];
      let rows = `<button class="drillback" data-act="back-stage"><span>‹ 返回</span><b>${stage.lab}</b></button>`;
      rows += `<div class="ul">`;
      rows += itemHTML({lab:"全部"+stage.lab});
      stage.items.forEach((g,i)=>{
        if(g.leaf){ rows += itemHTML({num:String(i+1).padStart(2,"0"), lab:g.lab}); }
        else{ rows += `<button class="item" data-act="grade" data-si="${c.stage}" data-gi="${i}">
          <span class="num">${String(i+1).padStart(2,"0")}</span><span class="lab">${g.lab}</span><span class="arr">›</span></button>`; }
      });
      rows += `</div>`;
      return rows;
    }
    /* 学段页 */
    let rows = `<button class="drillback" data-act="back-root"><span>‹ 返回</span><b>教育资源</b></button>`;
    rows += `<div class="ul">`;
    rows += itemHTML({lab:"全部教育资源"});
    EDU.forEach((st,i)=>{
      if(st.leaf){ rows += itemHTML({num:String(i+1).padStart(2,"0"), lab:st.lab}); }
      else{ rows += `<button class="item" data-act="stage" data-si="${i}">
        <span class="num">${String(i+1).padStart(2,"0")}</span><span class="lab">${st.lab}</span><span class="arr">›</span></button>`; }
    });
    rows += `</div>`;
    return rows;
  }

  /* 主菜单：一级 + 分组 */
  let h = `<ul class="ul">`;
  PRIMARY.forEach(p=>{
    h += `<li>${itemHTML(p, s.active===p.href)}`;
    if(p.edu){
      h += `<button class="edubtn" data-act="edu-open"><span>浏览学段 ›</span></button>`;
    }
    h += `</li>`;
  });
  h += `</ul>`;
  GROUPS.forEach(g=>{
    const closed = !!s.closed[g.name];
    h += `<section class="grp ${closed?'is-closed':''}">
      <button class="gtitle" data-act="toggle" data-group="${g.name}">
        <span class="gname">${g.name}</span><span class="gline"></span><span class="gcaret">▾</span>
      </button>
      <div class="glist"><ul class="ul">`;
    g.items.forEach(([ico,lab])=>{
      h += `<li>${itemHTML({ico,lab})}</li>`;
    });
    h += `</ul></div></section>`;
  });
  return h;
}

function renderAside(container, s){
  const themeCls = s.theme==='dark' ? 'shj-dark' : 'shj-light';
  container.innerHTML = `
    <div class="panel-cap">${s.theme==='dark'?'【玄墨档】shanhaijing':'【宣纸档】shanhaijing-light'}</div>
    <aside class="shj ${themeCls} ${s.rail?'is-rail':''}">
      <div class="brand">
        <span class="seal">山</span>
        <span class="brandtext"><b>FluxTorrent</b><i>山海经主题</i></span>
      </div>
      <nav class="scroll" data-nav>${navHTML(s)}</nav>
      <div class="foot">
        <a class="realm"><span class="rseal">管</span>
          <span class="rtext"><b>站长</b><i>等级 · ↑ 1.2TB</i></span></a>
        <button class="utilbtn" data-act="theme">🌗 ${s.theme==='dark'?'宣纸':'玄墨'}</button>
        <button class="utilbtn" data-act="rail">${s.rail?'» 展开':'« 收轨'} <span class="foldtext">${s.rail?'':'收起侧栏'}</span></button>
      </div>
    </aside>`;
}

/* 两个 aside 实例 */
const states = [ newState('dark'), newState('light') ];
const two = document.getElementById('two');
const columns = [ document.createElement('div'), document.createElement('div') ];
columns.forEach(c=>two.appendChild(c));

function statusTxt(s){
  if(!s.edu) return '主菜单（一级 + 六分组）';
  const c=s.edu;
  if(c.stage<0) return '教育钻取 · 第 1 页：学段（幼儿园/小学/初中/高中/大学）';
  if(c.grade==null){ const st=EDU[c.stage]; return `教育钻取 · 第 2 页：${st.lab}（年级列表）`; }
  const st=EDU[c.stage], g=st.items[c.grade];
  return `教育钻取 · 第 3 页：${st.lab} · ${g.lab}（科目直达）`;
}

function renderAll(){
  columns.forEach((col,i)=>{
    col.innerHTML='';
    const asideBox=document.createElement('div');
    col.appendChild(asideBox);
    renderAside(asideBox, states[i]);
  });
  /* 状态条：跟当前交互的 aside 走（取 dark 那个为代表） */
  document.getElementById('statusbar').innerHTML = '当前：<b>'+statusTxt(states[0])+'</b>';
}

/* 事件委托：两栏各自绑定 */
columns.forEach((col,i)=>{
  col.addEventListener('click',(e)=>{
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const s = states[i];
    const act = btn.dataset.act;
    if(act==='toggle'){ s.closed[btn.dataset.group]=!s.closed[btn.dataset.group]; }
    else if(act==='edu-open'){ s.edu={stage:-1,grade:null}; }
    else if(act==='stage'){ s.edu={stage:+btn.dataset.si,grade:null}; }
    else if(act==='grade'){ s.edu={stage:+btn.dataset.si,grade:+btn.dataset.gi}; }
    else if(act==='back-stage'){ s.edu={stage:s.edu.stage,grade:null}; }
    else if(act==='back-grade'){ s.edu={stage:s.edu.stage,grade:null}; }
    else if(act==='back-root'){ s.edu=null; }
    else if(act==='theme'){ s.theme = s.theme==='dark'?'light':'dark'; }
    else if(act==='rail'){ s.rail=!s.rail; }
    else if(act==='nav'){ s.active=btn.dataset.href; }
    renderAll();
  });
});

renderAll();
</script>
</body>
</html>
