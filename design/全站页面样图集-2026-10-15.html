<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FluxTorrent 全站页面样图集（60+ 页 · 4 断点 · 11 站型）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232fa8ff'/%3E%3Cpath d='M7 12l3 3 7-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* ============ 全站设计令牌（统一 Aurora 蓝系，对齐详情页规范） ============ */
:root{
  --sky:#2fa8ff; --sky-deep:#1e8ae8; --sky-soft:#e8f4ff; --sky-line:#c4e0f7;
  --mint:#2fbf9b; --mint-deep:#1d8f73; --mint-soft:#dff7f0;
  --coral:#ff7a59; --coral-soft:#ffe9e2;
  --sun:#ffc93c; --sun-soft:#fff4d6;
  --indigo:#5b6bf5; --indigo-soft:#eaebff;
  --candy:#ff8fc7; --candy-soft:#ffe9f4;
  --violet:var(--indigo); --violet-soft:var(--indigo-soft);
  --ink:#1f2a44; --sub:#6b7a99; --faint:#94a3b8;
  --line:#e3edf7; --line-soft:#eef2f6;
  --card:#ffffff; --page:#f5faff; --panel:#f8fafc;
  --r-xs:10px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:24px;
  --sh-1:0 8px 24px rgba(31,42,68,.08); --sh-2:0 12px 32px rgba(47,168,255,.16);
  --font:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  --font-display:"ZCOOL KuaiLe","STKaiti","KaiTi","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:#0d1b2e;color:var(--ink);font-size:14px;line-height:1.55}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* ============ 样图集外壳（非站点本身，是样图浏览壳） ============ */
.gallery-top{position:sticky;top:0;z-index:60;background:linear-gradient(135deg,#0f2a4a,#16355c);border-bottom:1px solid rgba(255,255,255,.08);color:#fff;padding:0 16px}
.gallery-top__row{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;height:52px}
.gallery-top__brand{font-weight:800;font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.gallery-top__brand svg{flex-shrink:0}
.gallery-top__search{flex:1;max-width:300px;position:relative}
.gallery-top__search input{width:100%;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;padding:0 30px 0 10px;font-size:13px;outline:none}
.gallery-top__search input::placeholder{color:#9fb6cc}
.gallery-top__search input:focus{border-color:var(--sky);background:rgba(255,255,255,.14)}
.gallery-top__search svg{position:absolute;right:8px;top:8px;opacity:.7}
.gallery-top__site{display:flex;align-items:center;gap:8px;margin-left:auto;white-space:nowrap}
.gallery-top__site select{height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:#173a66;color:#fff;font-size:12.5px;padding:0 8px;outline:none}
.gallery-top__badge{font-size:11.5px;background:rgba(30,138,232,.28);border:1px solid rgba(94,184,255,.4);color:#bfe0ff;padding:3px 10px;border-radius:999px;white-space:nowrap}
.gallery-nav{background:#12273f;border-bottom:1px solid rgba(255,255,255,.06);padding:0 16px}
.gallery-nav__inner{max-width:1400px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.gallery-nav__inner::-webkit-scrollbar{display:none}
.gallery-nav__item{flex-shrink:0;padding:9px 14px;font-size:13px;color:#9fb6cc;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.gallery-nav__item:hover{color:#fff}
.gallery-nav__item.on{color:#fff;border-bottom-color:var(--sky);font-weight:700}
.gallery-side{position:sticky;top:104px;align-self:flex-start;width:218px;flex-shrink:0;background:#12273f;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px;max-height:calc(100vh - 120px);overflow-y:auto}
.gallery-side::-webkit-scrollbar{width:4px}
.gallery-side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
.gallery-side__grp{font-size:11px;letter-spacing:1.5px;color:#6d87a5;font-weight:700;padding:10px 8px 4px}
.gallery-side__item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;color:#b9cbe0;font-size:12.5px;cursor:pointer}
.gallery-side__item:hover{background:rgba(255,255,255,.06);color:#fff}
.gallery-side__item.on{background:rgba(30,138,232,.22);color:#cfe6ff;font-weight:700}
.gallery-side__item .dot{width:5px;height:5px;border-radius:50%;background:#41597a;flex-shrink:0}
.gallery-side__item.on .dot{background:var(--sky)}
.gallery-main{flex:1;min-width:0;padding:18px 0 60px}
.gallery-page-head{display:flex;align-items:baseline;gap:10px;margin:4px 4px 14px;flex-wrap:wrap}
.gallery-page-head h1{font-size:21px;font-weight:800;color:#fff;font-family:var(--font-display)}
.gallery-page-head .meta{font-size:12px;color:#7f97b3}
.gallery-page-head .type{font-size:11px;background:rgba(47,191,155,.18);border:1px solid rgba(47,191,155,.35);color:#7fe3c9;padding:2px 9px;border-radius:999px}
.gallery-layout{max-width:1400px;margin:0 auto;display:flex;gap:16px;padding:0 16px}
@media (max-width:1024px){.gallery-side{display:none}.gallery-top__badge{display:none}.gallery-top__site select{max-width:110px}}

/* ============ 站点页面样图（统一组件语言，替代原 7 套体系） ============ */
.site-frame{background:var(--page);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35);margin-bottom:22px}
.site-frame__bar{display:flex;align-items:center;gap:8px;background:#0d1b2e;padding:8px 12px;border-radius:14px 14px 0 0}
.site-frame__bar .brow{width:10px;height:10px;border-radius:50%;background:#3a5575}
.site-frame__bar .btab{flex:1;max-width:340px;height:20px;background:#1c3555;border-radius:5px;display:flex;align-items:center;padding:0 8px;color:#6d87a5;font-size:10px;gap:6px}
.site-frame__bar .bw{font-size:11px;color:#7f97b3;font-weight:700;margin-left:auto;padding-right:4px}
.site-frame__body{position:relative;overflow:hidden}
.site-frame__body .fwin{container-type:inline-size;width:100%;max-width:1440px;margin:0 auto;background:var(--page)}

/* 站点布局壳（全站统一） */
.site-shell{display:flex;min-height:200px}
.site-header{background:#0f2a4a;color:#fff}
.site-header__top{display:flex;align-items:center;gap:14px;padding:0 16px;height:44px;border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(135deg,#0f2a4a,#173a66)}
.site-header__logo{font-weight:800;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.site-header__logo i{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--sky),#5bb8ff);display:inline-block;position:relative}
.site-header__logo i::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.85)}
.site-header__nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.site-header__nav::-webkit-scrollbar{display:none}
.site-header__nav a{color:#b9cbe0;font-size:13px;padding:0 10px;white-space:nowrap;height:43px;display:flex;align-items:center}
.site-header__nav a:hover{color:#fff}
.site-header__nav a.on{color:#fff;font-weight:700;box-shadow:inset 0 -2px 0 var(--sky)}
.site-header__right{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
.site-header__user{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#dbe7f3}
.site-header__user .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f2b01e,#f2711e);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.site-header__coin{font-size:12px;color:#ffd47e;background:rgba(242,176,30,.14);border:1px solid rgba(242,176,30,.35);padding:1px 8px;border-radius:999px}
.site-subnav{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 16px;height:38px;overflow-x:auto;scrollbar-width:none}
.site-subnav::-webkit-scrollbar{display:none}
.site-subnav a{color:var(--sub);font-size:12.5px;padding:0 11px;white-space:nowrap;height:37px;display:flex;align-items:center}
.site-subnav a:hover{color:var(--sky)}
.site-subnav a.on{color:var(--sky);font-weight:700;box-shadow:inset 0 -2px 0 var(--sky)}
.site-body{display:flex;gap:16px;padding:16px;align-items:flex-start}
.site-main{flex:1;min-width:0}
.site-aside{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.bank-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bank-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@container (max-width:900px){.bank-cols{grid-template-columns:1fr}}
@container (max-width:640px){.bank-stats{grid-template-columns:repeat(2,1fr)}}
.bank-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bank-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@container (max-width:900px){.bank-cols{grid-template-columns:1fr}}
@container (max-width:640px){.bank-stats{grid-template-columns:repeat(2,1fr)}}
.site-footer{background:#0f2a4a;color:#7f97b3;font-size:11.5px;padding:16px;border-radius:0 0 14px 14px}
.site-footer b{color:#b9cbe0}
.site-footer__cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:18px;margin-bottom:12px}
.site-footer h4{font-size:12px;color:#c9dcef;font-weight:800;margin-bottom:8px}
.site-footer__cols ul{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px}
.site-footer__cols li{font-size:12px;cursor:pointer}
.site-footer__cols li:hover{color:#fff}
.site-footer__bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;border-top:1px solid rgba(255,255,255,.1);padding-top:10px;font-size:11px}
/* 更多下拉（真实 MainMenu「更多 ▾」口径） */
.site-header{position:relative}
.site-header__more{position:relative;display:flex;align-items:center}
.site-header__more>button{background:none;border:none;color:#b9cbe0;font-size:13px;padding:0 10px;height:43px;display:flex;align-items:center;gap:4px;cursor:pointer;font-family:inherit}
.site-header__more>button:hover{color:#fff}
.site-header__more>button.on{color:#fff;font-weight:700;box-shadow:inset 0 -2px 0 var(--sky)}
.site-more{position:absolute;top:44px;right:0;min-width:560px;max-height:min(72vh,600px);overflow:auto;background:#0f2a4a;border:1px solid rgba(94,184,255,.25);border-radius:12px;padding:12px;display:none;z-index:70;box-shadow:0 18px 44px rgba(0,0,0,.5);grid-template-columns:repeat(2,1fr);gap:4px 14px}
.site-more.open{display:grid}
.site-more .mg{font-size:11px;letter-spacing:1px;color:#6d87a5;font-weight:800;margin:8px 0 4px;grid-column:1/-1}
.site-more a{font-size:12.5px;color:#b9cbe0;padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.site-more a:hover{background:rgba(30,138,232,.18);color:#fff}
.site-more a i{width:5px;height:5px;border-radius:50%;background:#41597a;display:inline-block;margin-right:7px;vertical-align:2px}
.site-more a.on{color:#cfe6ff;font-weight:700}
/* 头像与用户菜单（真实 user-menu 口径） */
.site-header__user{position:relative}
.site-header__user>button{background:none;border:none;display:flex;align-items:center;gap:7px;color:#dbe7f3;font-size:12.5px;cursor:pointer;font-family:inherit;padding:4px 6px;border-radius:8px}
.site-header__user>button:hover{background:rgba(255,255,255,.1)}
.site-header__bell{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#b9cbe0;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;position:relative}
.site-header__bell:hover{color:#fff;background:rgba(255,255,255,.14)}
.site-header__bell .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--coral)}
.site-header__user .um-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#ffd98a;background:rgba(255,214,130,.14);border:1px solid rgba(255,214,130,.35);border-radius:999px;padding:2px 9px;cursor:pointer;margin-right:2px;text-decoration:none}
.um-avatar-lg,.um-name,.um-bonus{text-decoration:none;color:inherit}
.site-header__user .um-chip:hover{background:rgba(255,214,130,.24)}
.site-header__user>button{position:relative}
.um-caret{font-size:9px;color:rgba(219,231,243,.75)}
.um-dot{position:absolute;top:-3px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#e5484d;color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* ===== 主菜单 · 用户弹窗（真实 UserMenu 四段结构） ===== */
.um-drop{position:absolute;top:44px;right:0;width:352px;background:#fff;border:1px solid var(--line);border-radius:14px;display:none;z-index:70;box-shadow:0 18px 44px rgba(15,23,42,.2);overflow:hidden}
.um-drop.open{display:block}
/* ① 摘要区 */
.um-summary{background:linear-gradient(120deg,#0f2a4a,#1e3a5f);color:#fff;padding:14px 14px 12px;display:flex;gap:10px;align-items:flex-start;position:relative}
.um-avatar-lg{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f2b01e,#f2711e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;cursor:pointer;border:2px solid rgba(255,255,255,.25)}
.um-avatar-lg:hover{border-color:#7fc4ff}
.um-summary-main{flex:1;min-width:0}
.um-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.um-name{font-size:14px;font-weight:800;cursor:pointer}
.um-name:hover{color:#7fc4ff}
.um-medal{width:14px;height:14px;border-radius:50%;flex-shrink:0;display:inline-block;border:1px solid rgba(255,255,255,.4)}
.um-sticker{font-size:10px;font-weight:700;color:#ffe9b8;background:rgba(255,214,130,.16);border:1px solid rgba(255,214,130,.4);border-radius:6px;padding:1px 7px}
.um-subline{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.um-bonus{font-size:11.5px;font-weight:700;color:#ffd98a;background:rgba(255,214,130,.14);border-radius:99px;padding:2px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.um-bonus:hover{background:rgba(255,214,130,.26)}
.um-checkin{font-size:11.5px;font-weight:700;color:#bfe8ff;background:rgba(126,196,255,.14);border:1px solid rgba(126,196,255,.4);border-radius:99px;padding:2px 10px;cursor:pointer;font-family:inherit}
.um-checkin:hover{background:rgba(126,196,255,.26)}
.um-checkin.done{color:#9ee6b8;border-color:rgba(158,230,184,.5);background:rgba(158,230,184,.12)}
.um-checkmsg{position:absolute;left:14px;right:14px;top:calc(100% - 4px);font-size:10.5px;color:#9ee6b8;background:rgba(9,26,46,.97);border-radius:8px;padding:6px 10px;z-index:2;display:none;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.um-checkmsg.show{display:block}
.um-logout{position:absolute;top:10px;right:12px;font-size:11px;color:rgba(255,255,255,.65);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:2px 9px;cursor:pointer}
.um-logout:hover{color:#ffb4b4;border-color:rgba(255,180,180,.5)}
/* ② 数据条（分享率/上传/下载/做种/下载中） */
.um-stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line-soft);background:#fbfdff}
.um-stat{text-align:center;padding:10px 4px 9px;border-right:1px solid var(--line-soft);cursor:pointer;text-decoration:none}
.um-stat:last-child{border-right:none}
.um-stat:hover{background:var(--sky-soft)}
.um-stat span{display:block;font-size:10px;color:var(--faint);margin-bottom:2px}
.um-stat b{display:block;font-size:12px;color:var(--ink);font-family:inherit}
.um-stat b.up{color:#2f9e63}
.um-stat b.dn{color:#d9714b}
/* ③ 快捷链接 */
.um-links{display:flex;flex-wrap:wrap;gap:6px;padding:11px 12px;border-bottom:1px solid var(--line-soft)}
.um-links a{font-size:11.5px;color:var(--sub);background:var(--sky-soft);border-radius:999px;padding:3px 11px;cursor:pointer}
.um-links a:hover{background:var(--sky);color:#fff}
.um-links a.staff{color:#c2410c;background:#fff7ed;border:1px solid #fed7aa;font-weight:700}
.um-links a.staff:hover{background:#ffedd5;color:#c2410c}
/* ④ 工具行（收件箱/发件箱/作弊者/举报/管理组/社交/RSS） */
.um-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:11px 12px 12px;background:#fbfdff}
.um-tool{height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.um-tool:hover{border-color:var(--sky);color:var(--sky);background:var(--sky-soft)}
.um-tool svg{width:17px;height:17px}
.um-tbadge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;padding:0 3px;border-radius:99px;background:#e5484d;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
@container (max-width:480px){
  .um-drop{position:fixed;top:46px;right:10px;left:10px;width:auto}
}
/* 本页功能入口清单 */
.entry-strip-wrap{padding:2px 16px 0}
.entry-strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(15,42,74,.06);border:1px dashed rgba(30,138,232,.35);border-radius:10px;padding:8px 10px;margin:0 0 14px}
.entry-strip__lbl{font-size:11px;font-weight:800;color:var(--sky);margin-right:4px;white-space:nowrap}
.entry-strip .pill{cursor:pointer}
.entry-strip .pill:hover{background:var(--sky-soft);border-color:var(--sky);color:var(--sky)}
/* 认证卡片（登录/注册/重置等） */
.auth-card{max-width:420px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 26px 20px;box-shadow:0 12px 32px rgba(15,23,42,.08)}
.auth-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--ink);margin-bottom:4px}
.auth-logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#2fa8ff,#1e8ae8);flex-shrink:0}
.auth-card h2{font-size:20px;color:var(--ink);margin:6px 0 2px}
.auth-card .auth-sub{font-size:12.5px;color:var(--faint);margin-bottom:16px}
.auth-alt{margin-top:14px;text-align:center;font-size:12.5px;color:var(--faint)}
.auth-alt a{color:var(--sky);cursor:pointer;text-decoration:none}
.auth-alt a:hover{text-decoration:underline}
.auth-card--wide{max-width:460px}
.auth-page{min-height:calc(100vh - 46px);display:flex;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(15,23,42,.08)}
.auth-intro{flex:0 0 46%;background:linear-gradient(168deg,#f8fbfe 0%,#e9f2fb 55%,#fdf6ea 100%);display:flex;align-items:center;justify-content:center;padding:38px;position:relative;border-right:1px solid var(--line)}
.auth-intro::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 270px at 12% 6%,rgba(47,124,246,.10),transparent 62%),radial-gradient(430px 250px at 90% 92%,rgba(232,185,74,.16),transparent 62%);pointer-events:none}
.auth-intro::after{content:"";position:absolute;left:38px;right:38px;bottom:34px;height:3px;border-radius:2px;background:linear-gradient(90deg,#2f7cf6 0%,#7fb2f8 55%,#e8b94a 100%);opacity:.55;pointer-events:none}
.auth-intro-in{position:relative;max-width:340px;width:100%}
.auth-intro-logo img{width:100%;height:100%;object-fit:cover;display:block}
.auth-intro-logo{width:92px;height:92px;border-radius:20px;display:block;margin-bottom:24px;box-shadow:0 18px 44px rgba(47,124,246,.38), 0 2px 8px rgba(15,23,42,.10);position:relative;flex-shrink:0;overflow:hidden}
.auth-intro h1{font-size:33px;font-weight:800;color:var(--ink);letter-spacing:.5px}
.auth-intro .tagline{font-size:14px;font-weight:700;color:#2f7cf6;margin-top:10px}
.auth-intro .desc{font-size:12.5px;line-height:1.8;color:var(--sub);margin-top:10px}
.auth-intro-stats{display:flex;margin-top:30px;padding-top:22px;border-top:1px solid rgba(23,42,74,.12)}
.auth-intro-stats>div{flex:1;text-align:center}
.auth-intro-stats>div+div{border-left:1px solid rgba(23,42,74,.10)}
.auth-intro-stats b{display:block;font-size:18px;font-weight:800;color:#163e9e;font-variant-numeric:tabular-nums}
.auth-intro-stats span{font-size:11px;color:var(--faint)}
.auth-side{flex:1;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:30px 36px;position:relative}
.auth-langrow{position:absolute;top:16px;right:22px;display:flex;align-items:center;gap:8px}
.auth-langrow select{border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;padding:5px 9px;color:var(--ink);outline:none}
.auth-langrow button{border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;padding:5px 9px;color:var(--sub);cursor:pointer}
.auth-notice{margin-top:18px;text-align:center;font-size:11px;color:var(--faint);line-height:1.75}
@media (max-width:880px){.auth-intro{flex:0 0 40%}}
@media (max-width:680px){.auth-page{flex-direction:column;min-height:0}.auth-intro{min-height:178px;padding:22px}.auth-intro-stats{display:none}.auth-intro-logo{width:64px;height:64px;margin-bottom:12px}.auth-side{padding:26px 18px}.auth-langrow{top:10px;right:14px}}
.auth-note{background:var(--line-soft,#F4F7FA);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--sub);line-height:1.65;margin-bottom:12px}
.auth-err{background:#fdecea;border:1px solid #f5c6be;color:#b42318;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.auth-soft{background:#fff7e6;border:1px solid #f5d9a8;color:#9a6700;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.auth-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sub);margin-top:2px}
.auth-row .ck{display:flex;align-items:center;gap:6px;cursor:pointer}
.auth-row .ck input{accent-color:var(--sky)}
.auth-linkbtn{background:none;border:none;color:var(--sky);font-size:12.5px;cursor:pointer;padding:0}
.auth-links{border-top:1px dashed var(--line);margin-top:14px;padding-top:11px;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--sub)}
.auth-links a{color:var(--sky);cursor:pointer;font-weight:600;text-decoration:none}
.auth-links a:hover{text-decoration:underline}
.pw-wrap{position:relative}
.pw-wrap .pw-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;color:var(--faint);padding:2px}
.captcha-row{display:flex;align-items:center;gap:8px}
.captcha-box{flex:1;background:var(--line-soft,#EEF3F8);border:1px solid var(--line);border-radius:8px;height:36px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:1px}
.auth-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-bottom:12px}
.auth-badge--open{background:#e3f6ec;color:#0f7a3d}
.auth-badge--invite{background:#e8f0fe;color:#1a56c9}
.auth-badge--closed{background:#fdecea;color:#b42318}
.auth-badge--verify{background:#fff7e6;color:#9a6700}
.auth-btn2{display:flex;gap:8px;margin-top:14px}
.auth-btn2 .btn{flex:1}
.auth-mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink);background:var(--line-soft,#F4F7FA);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
.auth-split{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:var(--faint);font-size:11px}
.auth-split:before,.auth-split:after{content:"";flex:1;height:1px;background:var(--line)}
/* 游戏走势 */
.trend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.trend .trend-bar{width:120px;height:10px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.trend .trend-bar i{display:block;height:100%;background:var(--sky);border-radius:99px}
.trend b{color:var(--ink);font-size:13px;min-width:28px}
/* 用户主页：5 指标磁贴 + 宠物位 + pill 标签 + 卡片网格 */
.up-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.up-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.up-stat__icon{width:34px;height:34px;border-radius:10px;background:var(--sky-soft);color:var(--sky-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.up-stat__icon--down{background:var(--coral-soft);color:#c23a2f}
.up-stat__icon--spark{background:var(--sun-soft);color:#b45309}
.up-stat__value{font-weight:800;font-size:15px;color:var(--ink)}
.up-stat__label{font-size:11px;color:var(--faint)}
.up-pet{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#eef6ff,#e9faf3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.up-pet-face{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.up-pet-meta b{font-size:13px;color:var(--ink);display:block}
.up-pet-meta span{font-size:11px;color:var(--faint)}
.up-pet .go{margin-left:auto;font-size:12px;font-weight:700;color:var(--sky-deep);cursor:pointer}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ptabs a{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
.ptabs a.on{border-color:var(--sky);background:var(--sky);color:#fff}
.up-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.up-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.up-card.full{grid-column:1/-1}
.up-card h4{font-size:13px;color:var(--ink);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;color:var(--sub)}
.row b{color:var(--ink);font-weight:700}
.pbar{height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden;flex:1}
.pbar i{display:block;height:100%;background:var(--sky);border-radius:99px}
.pbar i.full{background:var(--mint)}
.up-medals{display:flex;flex-wrap:wrap;gap:6px}
.up-medals span{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--line-soft);border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700;color:var(--ink)}
/* 用户主页 tab 内容容器 */
.ptab-pane{display:none}
.ptab-pane.on{display:block}
.utab-pane{display:none}
.utab-pane.on{display:block}
.up-hero .medal-chip{display:inline-flex;width:20px;height:20px;border-radius:99px;background:rgba(255,255,255,.18);align-items:center;justify-content:center;font-size:11px;margin-left:3px}
.up-hero .sticker{display:inline-block;border-radius:99px;background:var(--sun);color:#3a2502;font-size:11px;font-weight:800;padding:2px 9px;margin-left:6px}
.up-hero .follow{font-size:12px;font-weight:700;color:var(--sky);cursor:pointer}
/* NexusPHP usercp 表格表单（rowhead/rowfollow） */
.ucp-form{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ucp-form td{padding:9px 14px;border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--ink);vertical-align:top;line-height:1.8}
.ucp-form td.rowhead{width:148px;background:#f4f8fc;color:var(--sub);font-weight:700;white-space:nowrap}
.ucp-form tr:last-child td{border-bottom:none}
.ucp-form .hint{font-size:11.5px;color:var(--faint)}
.ucp-form .hint b{color:var(--coral-deep,#c23a2f);font-weight:700}
.ucp-form input[type=radio],.ucp-form input[type=checkbox]{accent-color:var(--sky);margin-right:4px;vertical-align:-2px}
.ucp-form .opt{display:inline-block;margin-right:14px}
.ucp-form .opt input{margin-right:3px}
.ucp-avatar{width:60px;height:60px;border-radius:10px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:24px;margin-bottom:6px;border:1px solid var(--line)}

/* 页面头（pg-head 统一组件，替代 pghd/pting-board__head/up-hero） */
.pg{padding:16px;background:var(--page)}
.pg-head{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh-1)}
.pg-head h1{font-size:18px;font-weight:800;color:var(--ink);line-height:1.3;font-family:var(--font-display)}
.pg-head .crumb{font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center;margin-bottom:2px}
.pg-head .crumb b{color:var(--sky)}
.pg-head .desc{font-size:12.5px;color:var(--sub)}
.pg-head__right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}

/* 面板（brand-panel 统一化） */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1);margin-bottom:12px}
.panel__head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:13.5px;font-weight:700}
.panel__head .hint{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400}
.panel__body{padding:14px}
.panel__body.tight{padding:0}

/* 按钮（td-btn 统一，替代各体系按钮） */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.btn--primary{background:var(--sky);color:#fff}
.btn--primary:hover{background:var(--sky-deep)}
.btn--mint{background:var(--mint);color:#fff}
.btn--mint:hover{background:var(--mint-deep)}
.btn--ghost{background:#fff;border-color:var(--line);color:var(--sub)}
.btn--ghost:hover{border-color:var(--sky);color:var(--sky)}
.btn--danger{background:#fff;border-color:#f3c9c7;color:var(--coral)}
.btn--danger:hover{background:var(--coral-soft)}
/* ===== 邀请系统 ===== */
.qcards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
@media (min-width:1024px){.qcards{grid-template-columns:repeat(5,1fr)}}
.qcards .qc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px}
.qcards .qc--wide{grid-column:span 2}
.qcards .qc-label{font-size:11px;color:var(--sub);font-weight:600}
.qcards .qc-value{font-size:19px;font-weight:800;margin-top:4px}
.qcards .qc-note{font-size:11px;color:var(--sub);margin-top:2px}
.inv-actions{display:flex;gap:6px;flex-wrap:wrap}
.inv-act{height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;white-space:nowrap;transition:all .15s}
.inv-act:hover{border-color:var(--sky);color:var(--sky);background:var(--sky-soft)}
.inv-act--ok{color:var(--sky);border-color:var(--sky-line)}
.inv-act--danger{color:var(--coral);border-color:#f3c9c7}
.inv-act--danger:hover{background:var(--coral-soft)}
.inv-code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--sky-deep);cursor:pointer}
.inv-code:hover{text-decoration:underline}
.invite-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center}
.invite-modal .im-mask{position:absolute;inset:0;background:rgba(15,23,42,.5)}
.invite-modal .im-card{position:relative;width:min(440px,92vw);background:#fff;border-radius:var(--r-lg);padding:20px 22px;box-shadow:0 24px 60px rgba(15,23,42,.28)}
.invite-modal .im-head{font-size:15px;font-weight:800;margin-bottom:10px}
.invite-modal .im-head--danger{color:var(--coral)}
.invite-modal .im-note{font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:12px}
.invite-modal .im-note .num{color:var(--ink)}
.invite-modal .im-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.invite-modal .input{width:100%}
/* ===== 任务系统 ===== */
.task-hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,#2fa8ff,#5b6bf5 55%,#ff8fc7);color:#fff;border-radius:var(--r-lg);padding:22px 24px;margin-bottom:14px}
.task-eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#7fc4ff}
.task-hero h2{font-size:22px;font-weight:800;margin-top:4px}
.task-hero p{font-size:12.5px;color:#bcd6ef;margin-top:4px;max-width:520px}
.task-hero-meta{display:flex;gap:10px}
.task-hero-meta>div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 16px;text-align:center}
.task-hero-meta span{display:block;font-size:11px;color:#bcd6ef}
.task-hero-meta strong{display:block;font-size:16px;font-weight:800;margin-top:2px}
.task-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;margin-bottom:14px}
.task-section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.task-section-heading>div{display:flex;align-items:baseline;gap:8px}
.task-section-heading>div>span{font-size:11px;font-weight:800;color:var(--sky);background:var(--sky-soft);border:1px solid var(--sky-line);border-radius:999px;padding:1px 9px}
.task-section-heading h2{font-size:15px;font-weight:800}
.task-section-heading p{font-size:11.5px;color:var(--sub)}
.task-rules ol{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:7px}
.task-rules li{counter-increment:r;font-size:12.5px;color:var(--sub);line-height:1.65;padding-left:26px;position:relative}
.task-rules li:before{content:counter(r,decimal-leading-zero);position:absolute;left:0;top:1px;font-size:11px;font-weight:800;color:var(--sky);background:var(--sky-soft);border-radius:6px;width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.task-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.task-tier-card{border:1px solid var(--line);border-radius:var(--r-md);background:#fff;padding:13px 14px;display:flex;flex-direction:column;gap:10px}
.task-tier-card>header h3{font-size:14px;font-weight:800}
.task-tier-card>header span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.task-tier-card dl{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;flex:1}
.task-tier-card dl div{display:flex;justify-content:space-between;gap:6px;font-size:11.5px}
.task-tier-card dl dt{color:var(--sub)}
.task-tier-card dl dd{font-weight:700;font-variant-numeric:tabular-nums}
.task-tier-card .brand-btn{align-self:flex-start}
.task-tier-card--master{border-top:3px solid #d4a017}
.task-tier-card--ultimate{border-top:3px solid #8b5cf6}
.task-tier-card--extreme{border-top:3px solid #e2555f}
.task-tier-card--veteran{border-top:3px solid #f28b30}
.task-tier-card--insane{border-top:3px solid var(--sky)}
.task-shop-card{border:1px dashed var(--sky-line);border-radius:var(--r-md);background:var(--sky-soft);padding:13px 14px;display:flex;flex-direction:column;gap:10px}
.task-shop-card>header h3{font-size:14px;font-weight:800;color:var(--sky-deep)}
.task-shop-card>header span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.task-shop-card dl{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;flex:1}
.task-shop-card dl div{display:flex;justify-content:space-between;gap:6px;font-size:11.5px}
.task-shop-card dl dt{color:var(--sub)}
.task-shop-card dl dd{font-weight:700;font-variant-numeric:tabular-nums}
.task-dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.task-feed{display:flex;flex-direction:column;gap:9px}
.task-feed>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line-soft);padding-bottom:8px}
.task-feed p{font-size:12.5px;color:var(--ink)}
.task-feed time{font-size:11px;color:var(--faint);white-space:nowrap}
.task-stats-summary{display:flex;gap:10px;margin-bottom:12px}
.task-stats-summary>div{flex:1;text-align:center;background:#fbfdff;border:1px solid var(--line-soft);border-radius:10px;padding:10px 6px}
.task-stats-summary strong{display:block;font-size:18px;font-weight:800}
.task-stats-summary span{font-size:11px;color:var(--sub)}
.task-stats-bars{display:flex;flex-direction:column;gap:9px}
.task-stats-bars>div{display:flex;align-items:center;gap:8px;font-size:11.5px}
.task-stats-bars span{width:64px;color:var(--sub);white-space:nowrap}
.task-stats-bars progress{flex:1;height:8px;border-radius:99px;overflow:hidden;accent-color:var(--sky);appearance:none}
.task-stats-bars progress::-webkit-progress-bar{background:var(--line-soft);border-radius:99px}
.task-stats-bars progress::-webkit-progress-value{background:var(--sky);border-radius:99px}
.task-stats-bars b{width:52px;text-align:right;font-variant-numeric:tabular-nums}
.brand-btn{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--sky);color:#fff;border:none;cursor:pointer;transition:all .15s}
.brand-btn:hover{background:var(--sky-deep)}
.brand-btn[disabled]{background:#dbe4ee;color:#93a4b8;cursor:not-allowed}
/* ===== 任务页标签组 ===== */
.mtabs{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 18px;margin-bottom:14px}
.mtabs__bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line-soft);padding-bottom:10px}
.mtabs__tab{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:99px;padding:4px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s}
.mtabs__tab:hover{border-color:var(--sky);color:var(--sky)}
.mtabs__tab.on{border-color:var(--sky);background:var(--sky);color:#fff}
.mtab-pane{display:none}
.mtab-pane.on{display:block}
.btn--sm{height:26px;padding:0 12px;font-size:12px;border-radius:999px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn--block{width:100%;justify-content:center}

/* 输入（td-input） */
.input{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 10px;font-size:13px;background:#fff;color:var(--ink);outline:none;transition:border .15s}
.input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(30,138,232,.12)}
.input--lg{height:38px;font-size:13.5px}
.select{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 8px;font-size:12.5px;background:#fff;color:var(--ink);outline:none}
textarea.input{padding:10px;height:auto;resize:vertical}
.label{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:5px;display:block}

/* 徽章（td-badge 统一，替代 sticker/request-status 等） */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.badge--sky{background:var(--sky-soft);color:var(--sky-deep);border:1px solid var(--sky-line)}
.badge--mint{background:var(--mint-soft);color:var(--mint-deep);border:1px solid #c2e9dd}
.badge--coral{background:var(--coral-soft);color:var(--coral);border:1px solid #f6d3d0}
.badge--sun{background:var(--sun-soft);color:#92400e;border:1px solid #f2dfae}
.badge--notice{background:var(--coral);color:#fff;border:none}
.badge--pin{background:var(--indigo-soft);color:var(--indigo);border:1px solid #cdd2ff}
.badge--violet{background:var(--indigo-soft);color:#3f4bd9;border:1px solid #c9cdfa}
.badge--gray{background:#eef2f7;color:#5b6b80;border:1px solid #dde5ee}

/* 表格（td-table 统一数据表格） */
.tbl-wrap{overflow-x:auto}
table.td-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.td-table th{background:#f1f5f9;color:#334155;font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
.td-table td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.td-table tr:hover td{background:#f8fafc}
.td-table .num{font-variant-numeric:tabular-nums}
.td-table .up{color:var(--mint-deep);font-weight:700}
.td-table .down{color:var(--coral);font-weight:700}
.td-table .name{font-weight:600;color:var(--ink)}
.td-table .name:hover{color:var(--sky)}
.td-table .sub{font-size:11px;color:var(--faint)}

/* 分类色（站型差异化数据） */
.cat{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:1px 8px;border-radius:5px;white-space:nowrap}
.cat--xl{font-size:12.5px;padding:2px 10px}

/* 空态/加载（td-state 统一） */
.state{padding:36px 16px;text-align:center;color:var(--faint);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.state svg{opacity:.5}
.skeleton{background:linear-gradient(90deg,#eef2f7 25%,#f6f8fb 50%,#eef2f7 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* 表单 */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field .hint{font-size:11px;color:var(--faint)}
.form-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}

/* 搜索盒（torrents 列表页） */
.searchbox{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:12px;box-shadow:var(--sh-1)}
.searchbox__row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.searchbox__row .input{flex:1;min-width:200px}
.searchbox__cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.searchbox__cats a{font-size:12px;color:var(--sub);padding:2px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer}
.searchbox__cats a:hover{color:var(--sky);border-color:var(--sky)}
.searchbox__cats a.on{background:var(--sky);color:#fff;border-color:var(--sky)}

/* 列表工具条 */
.listtools{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.listtools .result{font-size:12px;color:var(--sub)}
.listtools .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:#eef2f7;border-radius:8px;padding:2px}
.seg a{font-size:12px;color:var(--sub);padding:3px 12px;border-radius:6px;cursor:pointer}
.seg a.on{background:#fff;color:var(--sky);font-weight:700;box-shadow:var(--sh-1)}

/* 分页 */
.pager{display:flex;gap:5px;justify-content:center;padding:14px 0 4px;flex-wrap:wrap}
.pager a{min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--sub);background:#fff}
.pager a.on{background:var(--sky);color:#fff;border-color:var(--sky);font-weight:700}
.pager a:hover:not(.on){border-color:var(--sky);color:var(--sky)}

/* hero（首页） */
.hero-banner{position:relative;border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.hero-banner::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(47,168,255,.92) 0%,rgba(91,107,245,.78) 50%,rgba(255,143,199,.42) 100%)}
.hero-banner .hero-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.hero-banner h2{font-size:22px;font-weight:800;font-family:var(--font-display)}
.hero-banner p{font-size:13px;opacity:.85;max-width:520px}
.hero-banner .hero-actions{display:flex;gap:8px;margin-top:6px}

/* 首页区块 */
.home-news{display:flex;flex-direction:column;gap:2px}
.home-news .item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.home-news .item:hover{background:var(--sky-soft)}
.home-news .item .t{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-news .item .t:hover{color:var(--sky)}
.home-news .item .d{font-size:11px;color:var(--faint);white-space:nowrap}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat-strip .st{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;text-align:center;box-shadow:var(--sh-1)}
.stat-strip .st b{font-size:19px;font-weight:800;color:var(--ink);display:block}
.stat-strip .st span{font-size:11px;color:var(--faint)}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);transition:box-shadow .15s,border-color .15s}
.tcard:hover{border-color:var(--sky);box-shadow:var(--sh-2)}
.tcard__poster{height:120px;background:linear-gradient(140deg,#2fa8ff,#5b6bf5);position:relative;display:flex;align-items:flex-end;padding:10px}
.tcard__poster .cat{position:absolute;top:8px;left:8px}
.tcard__poster .sz{color:rgba(255,255,255,.9);font-size:11px;font-weight:700;background:rgba(0,0,0,.35);padding:1px 7px;border-radius:5px}
.tcard__bd{padding:10px 12px}
.tcard__bd .t{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard__bd .meta{display:flex;gap:10px;font-size:11px;color:var(--faint);margin-top:4px;flex-wrap:wrap}
.tcard__bd .meta b{color:var(--sub)}

/* 论坛 */
.forum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

/* ===== 开源论坛三栏（左 版块导航 / 中 帖子列表 / 右 信息小部件） ===== */
.f3b{display:grid;grid-template-columns:200px minmax(0,1fr) 250px;gap:14px;align-items:start}
.f3b-left,.f3b-right{display:flex;flex-direction:column;gap:12px;min-width:0}
.f3b-user{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:var(--sh-1)}
.f3b-user__row{display:flex;gap:10px;align-items:center}
.f3b-user__av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2fa8ff,#5b6bf5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
.f3b-user__name{font-weight:800;font-size:14px;color:var(--ink)}
.f3b-user__meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.f3b-user__stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;border-top:1px solid var(--line-soft);padding-top:10px;text-align:center}
.f3b-user__stats b{display:block;font-size:13px;color:var(--ink)}
.f3b-user__stats span{font-size:10.5px;color:var(--sub)}
.f3b-nav{display:flex;flex-direction:column;gap:1px}
.f3b-nav__group{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--sub);padding:8px 10px 3px;letter-spacing:.5px}
.f3b-nav__group::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--line);flex-shrink:0}
.f3b-nav__item{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;color:var(--ink);border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
.f3b-nav__item:hover{background:var(--sky-soft);color:var(--sky-deep)}
.f3b-nav__item.active{background:var(--sky-soft);color:var(--sky-deep);font-weight:700}
.f3b-nav__item--sub{padding-left:24px}
.f3b-nav__item i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.f3b-nav__item .cnt{margin-left:auto;font-size:11px;color:var(--sub)}
.f3b-links a{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;color:var(--ink);border-radius:10px;transition:background .15s}
.f3b-links a:hover{background:var(--sky-soft);color:var(--sky-deep)}
.f3b-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.f3b-search{flex:1;min-width:180px;display:flex;gap:8px}
.f3b-search input{flex:1;height:34px;border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:13px;background:#fff;color:var(--ink);outline:none;transition:border .15s}
.f3b-search input:focus{border-color:var(--sky)}
.f3b-title h1{font-size:20px;font-weight:800;color:var(--ink);font-family:var(--font-display);line-height:1.3}
.f3b-title p{font-size:12px;color:var(--sub);margin-top:2px}
.f3b-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.f3-feed-pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:var(--indigo-soft);color:var(--indigo);font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.f3-feed-pill:hover{background:var(--indigo);color:#fff}
.f3b-list{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1)}
.f3b-list__head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);background:#fbfdff}
.f3b-list__head .sp{flex:1;min-width:0}
.f3b-list__head b{color:var(--ink);font-size:12.5px}
.f3b-topic{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .15s}
.f3b-topic:last-child{border-bottom:none}
.f3b-topic:hover{background:#f8fafc}
.f3b-topic--notice{background:var(--coral-soft);box-shadow:inset 3px 0 0 var(--coral)}
.f3b-topic--notice:hover{background:#ffd9cf}
.f3b-topic--pin{background:var(--sky-soft);box-shadow:inset 3px 0 0 var(--sky)}
.f3b-topic--pin:hover{background:#d9edff}
.f3b-topic.pin{background:var(--sky-soft)}
.f3b-topic.pin:hover{background:#d9edff}
.f3b-topic__main{flex:1;min-width:0}
.f3b-topic__title{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;min-width:0}
.f3b-topic__title .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f3b-topic__title .t:hover{color:var(--sky)}
.f3b-topic__meta{font-size:11px;color:var(--faint);margin-top:3px}
.f3b-topic__meta b{color:var(--sub);font-weight:600}
.f3b-topic__stats{display:flex;align-items:center;gap:16px;flex-shrink:0}
.f3b-topic__reply{text-align:center;min-width:34px}
.f3b-topic__reply b{font-size:14px;color:var(--ink)}
.f3b-topic__reply small{display:block;font-size:10px;color:var(--faint)}
.f3b-topic__last{text-align:right;min-width:86px}
.f3b-topic__last b{font-size:12px;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f3b-topic__last small{font-size:10px;color:var(--faint)}
.f3b-topic .hot-tag{color:var(--coral);font-size:10.5px;font-weight:700;flex-shrink:0}
/* 帖子行发布者头像 */
.f3b-topic__av{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
/* 版块页 */
.fb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.fb-head h1{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--ink)}
.fb-head .desc{font-size:12px;color:var(--sub)}
.fb-rules{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;font-size:12.5px;color:var(--sub);line-height:1.8}
.fb-rules b{color:var(--ink)}
/* 关注流页 */
.fb-flow-tab{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fb-flow-tab a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12.5px;color:var(--sub);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.fb-flow-tab a.on,.fb-flow-tab a:hover{border-color:var(--sky);background:var(--sky-soft);color:var(--sky-deep)}
.fb-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .15s}
.fb-item:hover{background:#f8fafc}
.fb-item .src{font-size:11px;color:var(--faint);margin-bottom:3px}
.fb-item .src b{color:var(--sky-deep)}
/* 发新帖页 */
.fn-form{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh-1)}
.fn-form .tf label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-top:14px}
.fn-form .tf label:first-child{margin-top:0}
.fn-form .tf select,.fn-form .tf input,.fn-form .tf textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;font-size:13px;background:#fff;color:var(--ink);outline:none;box-sizing:border-box;margin-top:6px;transition:border .15s}
.fn-form .tf select:focus,.fn-form .tf input:focus,.fn-form .tf textarea:focus{border-color:var(--sky)}
.fn-form .tf textarea{min-height:200px;resize:vertical}
.fn-side{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;font-size:12.5px;color:var(--sub);line-height:1.9}
.f3b-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
@container (max-width: 1100px){ .f3b-grid{grid-template-columns:minmax(0,1fr) 240px} }
@container (max-width: 768px){ .f3b-grid{grid-template-columns:1fr} }
/* 社区页通用 */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--sky-soft);color:var(--sky-deep);font-size:12.5px}
.pill--gray{background:var(--line);color:var(--sub)}
.poll-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--ink)}
.poll-bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.poll-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--sky),var(--indigo))}
.poll-pct{width:40px;text-align:right;color:var(--sub);font-size:12px;font-weight:700}
.req-table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.req-table th,.req-table td{padding:8px 6px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req-table th{color:var(--sub);font-weight:600;font-size:11.5px}
.req-table .name{color:var(--ink);font-weight:600}
.req-table tr:hover td{background:#f8fafc}
.f3b-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.f3b-filter a{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--sub);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.f3b-filter a:hover,.f3b-filter a.on{border-color:var(--sky);background:var(--sky-soft);color:var(--sky-deep)}
.f3b-filter a .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.topic-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center}
.topic-modal .im-mask{position:absolute;inset:0;background:rgba(15,23,42,.5)}
.topic-modal .im-card{position:relative;width:min(660px,94vw);background:#fff;border-radius:var(--r-lg);padding:20px 22px;box-shadow:0 24px 60px rgba(15,23,42,.28);max-height:88vh;overflow:auto}
.topic-modal .tf label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-top:14px}
.topic-modal .tf label:first-child{margin-top:0}
.topic-modal .tf select,.topic-modal .tf input,.topic-modal .tf textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;font-size:13px;background:#fff;color:var(--ink);outline:none;box-sizing:border-box;margin-top:6px;transition:border .15s}
.topic-modal .tf select:focus,.topic-modal .tf input:focus,.topic-modal .tf textarea:focus{border-color:var(--sky)}
.topic-modal .tf textarea{min-height:120px;resize:vertical}
.topic-notice{display:flex;align-items:center;gap:8px;background:var(--coral-soft);border:1px solid #f6d3d0;border-radius:var(--r-md);padding:10px 14px;font-size:12.5px;color:var(--ink);margin-bottom:12px}
.topic-notice b{color:var(--coral)}
.f3b-hot{display:flex;flex-direction:column}
.f3b-hot .row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12.5px}
.f3b-hot .row:last-child{border-bottom:none}
.f3b-hot .row .rk{width:18px;height:18px;border-radius:50%;background:var(--sky-soft);color:var(--sky-deep);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.f3b-hot .row:nth-child(1) .rk,.f3b-hot .row:nth-child(2) .rk,.f3b-hot .row:nth-child(3) .rk{background:var(--coral-soft);color:var(--coral)}
.f3b-hot .row .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f3b-hot .row .rc{font-size:11px;color:var(--sub);flex-shrink:0}
.f3b-lr{display:flex;flex-direction:column}
.f3b-lr .row{display:flex;flex-direction:column;gap:2px;padding:8px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.f3b-lr .row:last-child{border-bottom:none}
.f3b-lr .who{font-size:12px;color:var(--ink);font-weight:600}
.f3b-lr .what{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f3b-lr .time{font-size:10.5px;color:var(--faint)}
.f3b-guide{background:linear-gradient(135deg,#2fa8ff,#5b6bf5);color:#fff;border-radius:var(--r-md);padding:14px}
.f3b-guide .gt{font-family:var(--font-display);font-size:14px;font-weight:700;margin-bottom:4px}
.f3b-guide .gd{font-size:11.5px;opacity:.85;margin-bottom:10px}
.f3b-guide .btn{background:#fff;color:var(--sky-deep)}
@container (max-width:1100px){.f3b{grid-template-columns:180px minmax(0,1fr) 220px}}
@container (max-width:1024px){
  .f3b{grid-template-columns:minmax(0,1fr)}
  .f3b-left{flex-direction:row;flex-wrap:wrap;gap:8px}
  .f3b-left .panel{flex:1;margin-bottom:0;min-width:160px}
  .f3b-user{display:none}
  .f3b-nav__group{display:none}
  .f3b-nav__item,.f3b-links a{background:var(--sky-soft);color:var(--sky-deep);padding:5px 10px;border-radius:999px;font-size:12px}
  .f3b-nav__item i{display:none}
  .f3b-nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .f3b-right{display:none}
}
@container (max-width:640px){.f3b-topic__stats .f3b-topic__last{display:none}.f3b-topic{padding:10px 12px}}
@container (max-width:480px){.f3b-search input{font-size:16px}}
.fboard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.fboard:hover{border-color:var(--sky);box-shadow:var(--sh-2)}
.fboard .nm{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.fboard .ds{font-size:12px;color:var(--sub);margin-top:4px}
.fboard .mt{font-size:11px;color:var(--faint);margin-top:6px;display:flex;gap:12px}
.fboard .mt b{color:var(--sky)}
.topic-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.topic-row:hover{background:#f8fafc}
.topic-row .tt{flex:1;min-width:0}
.topic-row .tt .t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-row .tt .t:hover{color:var(--sky)}
.topic-row .tt .m{font-size:11px;color:var(--faint);margin-top:2px}
.topic-row .cnt{text-align:right;flex-shrink:0}
.topic-row .cnt b{display:block;font-size:13px}
.topic-row .cnt span{font-size:10.5px;color:var(--faint)}
.post-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh-1)}
.post-card__head{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);align-items:center}
.post-card__head .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2fa8ff,#1e8ae8);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.post-card__head .who b{font-size:13px;display:block}
.post-card__head .who span{font-size:11px;color:var(--faint)}
.post-card__head .role{margin-left:auto}
.post-card__bd{padding:14px;font-size:13px;color:#334155}
.post-card__bd .actions{display:flex;gap:10px;margin-top:12px;font-size:12px;color:var(--sub)}
.post-card__bd .actions a{cursor:pointer}
.post-card__bd .actions a:hover{color:var(--sky)}

/* 消息/通知 */
.msg-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0}
.msg-tabs a{font-size:12.5px;color:var(--sub);padding:9px 14px;position:relative;cursor:pointer}
.msg-tabs a.on{color:var(--sky);font-weight:700}
.msg-tabs a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--sky);border-radius:2px}
.msg-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.msg-row:hover{background:#f8fafc}
.msg-row.unread{background:var(--sky-soft)}
.msg-row .t{flex:1;min-width:0}
.msg-row .t .tt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-row .t .tt .unread-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sky);margin-right:5px;vertical-align:1px}
.msg-row .t .m{font-size:11.5px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-row .d{font-size:11px;color:var(--faint);flex-shrink:0}

/* 商店/勋章 */
.shop-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.shop-tabs a{font-size:12.5px;color:var(--sub);padding:5px 13px;border-radius:999px;border:1px solid var(--line);cursor:pointer}
.shop-tabs a.on{background:var(--sky);color:#fff;border-color:var(--sky);font-weight:700}
.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;position:relative;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}
.gcard:hover{border-color:var(--sky);box-shadow:var(--sh-2)}
.gcard .gicon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:9px}
.gcard .nm{font-size:13.5px;font-weight:700}
.gcard .kind{font-size:11px;color:var(--faint);margin-top:2px}
.gcard .hint{font-size:11px;color:var(--sub);margin-top:6px;min-height:30px}
.gcard .price{font-size:15px;font-weight:800;color:var(--sun);margin-top:8px}
.gcard .price small{font-size:11px;color:var(--faint);font-weight:400}
.gcard .acts{display:flex;gap:6px;margin-top:10px}
.gcard-best{position:absolute;top:-1px;right:12px;background:linear-gradient(135deg,#f2b01e,#f2711e);color:#fff;font-size:10px;font-weight:800;padding:2px 9px;border-radius:0 0 8px 8px}
.medal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.medal{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 8px;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s}
.medal:hover{border-color:var(--violet);transform:translateY(-2px)}
.medal .md{width:54px;height:54px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}
.medal .md::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px dashed rgba(0,0,0,.12)}
.medal .nm{font-size:12px;font-weight:700}
.medal .rar{font-size:10.5px;color:var(--faint);margin-top:2px}

/* 用户主页 */
.up-hero{background:linear-gradient(120deg,#2fa8ff,#5b6bf5 55%,#ff8fc7);color:#fff;border-radius:var(--r-lg);padding:18px;display:flex;gap:16px;align-items:center;margin-bottom:12px}
.up-hero .av{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#f2b01e,#f2711e);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex-shrink:0}
.up-hero .who h2{font-size:19px;font-weight:800}
.up-hero .who .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.up-hero .stats{margin-left:auto;display:grid;grid-template-columns:repeat(4,auto);gap:16px;flex-shrink:0}
.up-hero .stats b{font-size:16px;font-weight:800;display:block;text-align:center}
.up-hero .stats span{font-size:10.5px;opacity:.75;text-align:center;display:block}
.up-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#fff;border-radius:var(--r-md) var(--r-md) 0 0;padding:0 6px}
.up-tabs a{font-size:12.5px;color:var(--sub);padding:10px 14px;position:relative;cursor:pointer}
.up-tabs a.on{color:var(--sky);font-weight:700}
.up-tabs a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--sky)}

/* 侧栏组件 */
.aside-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px;box-shadow:var(--sh-1)}
.aside-card .hd{font-size:12.5px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.aside-card .hd::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--sky)}
.aside-card .kv{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--sub)}
.aside-card .kv b{color:var(--ink);font-weight:700}
.panel .kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;padding:4px 0;color:var(--sub);border-bottom:1px dashed var(--line-soft)}
.panel .kv b{color:var(--ink);font-weight:700;text-align:right;white-space:nowrap}
.panel .kv:last-child{border-bottom:0}
.progress{height:6px;background:#eef2f7;border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sky);border-radius:4px}

/* 用户中心（usercp）布局 */
.ucp-layout{display:flex;gap:14px}
.ucp-side{width:190px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:8px;box-shadow:var(--sh-1);align-self:flex-start}
.ucp-side .grp{font-size:10.5px;letter-spacing:1px;color:var(--faint);font-weight:800;padding:8px 9px 3px}
.ucp-side a{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;color:var(--sub);cursor:pointer}
.ucp-side a:hover{background:var(--sky-soft);color:var(--sky)}
.ucp-side a.on{background:var(--sky);color:#fff;font-weight:700}
.ucp-main{flex:1;min-width:0}

/* 游戏大厅（街机风） */
.arcade-hero{background:radial-gradient(900px 300px at 20% -20%,rgba(94,184,255,.4),transparent),radial-gradient(700px 260px at 85% 10%,rgba(138,99,210,.35),transparent),#101f38;border-radius:var(--r-lg);padding:20px;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:16px;border:1px solid rgba(94,184,255,.25)}
.arcade-hero h2{font-size:20px;font-weight:800}
.arcade-hero p{font-size:12.5px;opacity:.75;margin-top:4px}
.arcade-hero .coin{margin-left:auto;font-size:13px;color:#ffd47e;background:rgba(242,176,30,.15);border:1px solid rgba(242,176,30,.4);padding:5px 14px;border-radius:999px;white-space:nowrap}
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.game-card{background:linear-gradient(160deg,#173a66,#0f2a4a);border:1px solid rgba(94,184,255,.2);border-radius:var(--r-md);padding:16px;color:#fff;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.game-card:hover{transform:translateY(-2px);border-color:rgba(94,184,255,.6)}
.game-card .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px;background:rgba(255,255,255,.1)}
.game-card .nm{font-size:14px;font-weight:800}
.game-card .ds{font-size:11.5px;opacity:.6;margin-top:3px}
.game-card .st{margin-top:10px;font-size:11px;color:#7fe3c9;display:flex;gap:10px}

/* 信息/文档页 */
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:var(--sh-1)}
.doc h3{font-size:15px;font-weight:800;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.doc h3::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--sky)}
.doc p{font-size:13px;color:var(--sub);margin-bottom:10px}
.doc ul{padding-left:20px;margin-bottom:10px}
.doc li{font-size:13px;color:var(--sub);margin-bottom:5px}
.faq-item{border-bottom:1px solid var(--line-soft);padding:12px 2px;cursor:pointer}
.faq-item .q{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.faq-item .q::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--sky);flex-shrink:0}
.faq-item .a{font-size:12.5px;color:var(--sub);margin-top:6px;padding-left:13px}

/* 个人中心面板 */
.overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

/* 站型切换条 */
.site-switch{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:#0d1b2e;border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px 12px}
.site-switch .lbl{font-size:11.5px;color:#7f97b3;font-weight:800;letter-spacing:1px;margin-right:4px}
.site-switch button{font-size:12px;color:#b9cbe0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);padding:4px 11px;border-radius:999px;cursor:pointer;transition:all .15s}
.site-switch button:hover{color:#fff;border-color:rgba(94,184,255,.5)}
.site-switch button.on{background:var(--sky);color:#fff;border-color:var(--sky);font-weight:700}
.site-switch .note{margin-left:auto;font-size:11.5px;color:#7fe3c9}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f2a4a;color:#fff;font-size:13px;padding:9px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:all .25s;z-index:99;border:1px solid rgba(94,184,255,.4);max-width:80vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ============ 4 断点响应式：站点内容由帧宽驱动（@container），壳由视口驱动（@media） ============ */
@container (max-width:1200px){.site-aside{width:230px}}
@container (max-width:1024px){
  .card-grid{grid-template-columns:repeat(2,1fr)}
  .shop-grid{grid-template-columns:repeat(3,1fr)}
  .medal-grid{grid-template-columns:repeat(4,1fr)}
  .game-grid{grid-template-columns:repeat(2,1fr)}
  .site-aside{display:none}
  .up-hero .stats{grid-template-columns:repeat(2,auto)}
  .site-body{flex-direction:column;align-items:stretch}
}
@container (max-width:768px){
  .stat-strip{grid-template-columns:repeat(2,1fr)}
  .forum-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .overview-grid{grid-template-columns:1fr}
  .up-grid{grid-template-columns:1fr}
  .ucp-form,.ucp-form tbody,.ucp-form tr,.ucp-form td{display:block;width:100%}
  .ucp-form td.rowhead{width:auto;background:none;padding-bottom:0}
  .ucp-form td{padding:6px 12px 10px}
  .ucp-form tr{border-bottom:1px solid var(--line-soft)}
  .up-hero{flex-wrap:wrap}
  .up-hero .stats{margin-left:0;grid-template-columns:repeat(2,1fr);width:100%}
  .site-subnav{display:none}
  .ucp-layout{flex-direction:column}
  .ucp-side{width:100%;display:flex;flex-wrap:wrap;gap:2px;padding:6px}
  .ucp-side .grp{display:none}
  .ucp-side a{flex:0 0 auto;padding:4px 10px;font-size:12px}
  .site-header__coin{display:none}
  .site-header__user>button span:last-child{display:none}
}
@container (max-width:480px){
  .card-grid,.shop-grid,.medal-grid,.game-grid{grid-template-columns:1fr}
  .up-stats{grid-template-columns:repeat(2,1fr)}
  .input, textarea.input{font-size:16px}
  .stat-strip{grid-template-columns:1fr 1fr}
  .hero-banner h2{font-size:18px}
  .site-header__nav a{padding:0 7px;font-size:12px}
  .site-header__top{padding:0 10px}
  .site-body{padding:10px}
  .site-more{min-width:0;width:min(320px,calc(100vw - 40px));right:-40px;grid-template-columns:1fr}
  .site-header__nav a:nth-child(n+4){display:none}
  .site-header__coin{display:none}
  .site-header__user>button span:last-child{display:none}
  .site-header__user .um-chip{display:none}
  .site-footer__cols{grid-template-columns:1fr;gap:10px}
}
@media (max-width:1024px){.gallery-side{display:none}.gallery-top__badge{display:none}.gallery-top__site select{max-width:110px}.gallery-top__search input{font-size:16px}}
</style>
