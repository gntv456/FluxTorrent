<link rel="stylesheet" href="css/game.css" />

<body>

<div id="app" class="app">
  <div class="frame">
    <div class="hud" id="hud">
      <div class="hud-left">
        <span class="hud-time" id="hudTime">08:00</span>
        <span class="hud-sep"></span>
        <span class="hud-season" id="hudSeason">赛季 · 第 1 天</span>
      </div>
      <div class="hud-right">
        <span class="magic-pill" id="hudMagic" title="魔力余额"><svg class="ic"><use href="#i-sparkle"/></svg><b>0</b></span>
        <button class="icon-btn" data-act="rules" title="玩法规则"><svg class="ic"><use href="#i-album"/></svg></button>
      </div>
    </div>

    <div class="view" id="view"></div>

    <nav class="tabbar" id="tabbar">
      <button class="tb on" data-act="tab" data-tab="pond"><svg class="ic"><use href="#i-scene"/></svg><span>渔场</span></button>
      <button class="tb" data-act="tab" data-tab="album"><svg class="ic"><use href="#i-album"/></svg><span>图鉴</span></button>
      <button class="tb" data-act="tab" data-tab="gear"><svg class="ic"><use href="#i-rod"/></svg><span>渔具</span></button>
      <button class="tb" data-act="tab" data-tab="bag"><svg class="ic"><use href="#i-bag"/></svg><span>背包</span></button>
      <button class="tb" data-act="tab" data-tab="shop"><svg class="ic"><use href="#i-shop"/></svg><span>商店</span></button>
    </nav>
  </div>
</div>

<div class="overlay" id="overlay" aria-hidden="true"></div>
<div class="toast-wrap" id="toastWrap"></div>
<pre id="dbg" style="display:none;position:fixed;left:0;top:0;z-index:99;background:#0b1a2e;color:#8ef;font:11px/1.5 monospace;padding:6px;margin:0;max-width:100%"></pre>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
