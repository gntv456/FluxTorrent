# FluxTorrent Docker Compose（方案 §8.4/§12 一键部署）
# 用法：cp docker/.env.example .env && docker compose up -d
#
# 镜像来源二选一（四个 flux 服务同时定义了 image + build）：
# - 预构建镜像（推荐，无需本机 Rust/Node 工具链）：docker compose pull && docker compose up -d
# - 本地源码构建（二次开发/内网）：docker compose up -d --build
# 镜像地址可经 .env 覆盖（FLUX_IMAGE_PREFIX / FLUX_VERSION），fork 站长可指向自己的 registry。
#
# 多套部署（同一宿主第二套站点）：container_name / 宿主端口 / 卷名默认都是固定的
# flux-* · 5432/6379/8080/3000/7070/6969 · docker_*，直接再起一套会整排撞名，
# 报错只说「container name is already in use」不告诉你怎么办。所有会撞的项都可经
# FLUX_*_CONTAINER / FLUX_*_PORT / FLUX_*_VOLUME 覆盖（见 .env.example 末节配方），
# 默认值即本机现状，不设就与以前完全一致。

# 日志轮转（运维 P1）：默认 json-file 无上限，tracker 高频日志可撑爆宿主磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${FLUX_PG_CONTAINER:-flux-postgres}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: fluxtorrent
    # 性能观测基线（六维强化方案 P0-7）：此前仓库没有任何慢查询日志/语句统计，
    # 所有性能目标都只能靠体感。pg_stat_statements 记录全量语句级耗时，
    # log_min_duration_statement 把 ≥300ms 的语句写进容器日志（json-file 10MB×3 轮转）。
    # 采集脚本：scripts/perf_baseline.py（产出 _doc/性能基线-*.md）。
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=5000
      -c log_min_duration_statement=300ms
    ports:
      - "127.0.0.1:${FLUX_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d fluxtorrent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${FLUX_REDIS_CONTAINER:-flux-redis}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    # ZT81（2026-10-02）：Redis 承载**计费事件流与死信**（flux:announce /
    # flux:announce:dlq），不是纯缓存，因此：
    #   ① allkeys-lru → noeviction：内存压力时宁可写失败，也不静默驱逐「尚未计费」
    #      的 stream 条目（原策略下 worker 停摆数小时即可能悄悄丢计费）；
    #   ② 开 AOF(everysec) + 具名卷：容器重建/宕机不再丢账——原先只有默认 RDB
    #      快照落在**匿名卷**上，且 scripts/backup.sh 明确「Redis 不备份」；
    #   ③ maxmemory 256m → 512m（容器上限同步提到 768m），为流积压留余量。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    environment:
      # 供 healthcheck 在容器内读密码（无密码 ping 曾造成 NOAUTH 下依旧 healthy 的假阳性）
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${FLUX_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ${FLUX_IMAGE_PREFIX:-ghcr.io/gntv456/fluxtorrent}/api:${FLUX_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: ${FLUX_API_CONTAINER:-flux-api}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          # ZT81（2026-10-02）：补 CPU 上限——此前只限内存，单容器可吃满宿主
          # CPU 拖垮邻居（worker 全表任务与 api/tracker 同机时最明显）。
          cpus: "2.0"
    environment:
      BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://flux:${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}@postgres:5432/fluxtorrent
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（至少 32 字节随机值）}
      DB_POOL_SIZE: "10"
      PUBLIC_TRACKER_URL: ${PUBLIC_TRACKER_URL:-http://localhost:7070}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # 功能性环境变量显式注入（空默认 = 功能静默禁用；此处列出让部署者可见可配）
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}          # RSS 信息页的 API 基址（空退 127.0.0.1）
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}        # RSS 链接前缀（空退 localhost:3000）
      PUBLIC_SITE_NAME: ${PUBLIC_SITE_NAME:-}      # 站点显示名（空退 FluxTorrent）
      SMTP_URL: ${SMTP_URL:-}                      # 邮件发送（空 = 邮件类通知跳过）
      SMTP_FROM: ${SMTP_FROM:-}                    # 发件人（空退 no-reply@fluxtorrent.local）
      ANN_METRICS_TOKEN: ${ANN_METRICS_TOKEN:-}    # api /metrics 门禁（空 = 端点 404 隐藏）
      # 反代模式（P1）：api 经 Nginx/Pingora 等反代对外时设 1，限流/封禁/登录事件改信
      # X-Forwarded-For 首值；api 直连暴露时必须留空（否则客户端可伪造头绕过风控）
      TRUST_PROXY: ${TRUST_PROXY:-}
      # 改密/重置密钥后**旧 passkey 的宽限时长**（小时，0 = 立即失效）。
      # passkey 烤在用户已下载的每一个 .torrent 里，一刀切失效 = 手上种子集体
      # 停种（10-07 P1-4）。注意这只该管「改密顺带轮换」；后台显式「重置密钥」
      # 是安全处置动作，旧钥必须立刻失效（见本轮报告 P2：两处目前共用同一档）。
      PASSKEY_GRACE_HOURS: ${PASSKEY_GRACE_HOURS:-168}
      # 只读副本（0227 G31 L 档）：空 = 无副本；设流复制实例时热点读分流
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      FLUX_DEV: ${FLUX_DEV:-}                      # 1 = 开发态（CORS 宽松/SMTP 日志闭环）
      FLUX_BACKUP_DIR: /backups                    # 与 backups 卷挂载对应
      # 附件对象存储（可选；storage_backend=s3 时生效，读取端自动回落本地卷）
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_KEY: ${S3_KEY:-}
      S3_SECRET: ${S3_SECRET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      RUST_LOG: info
    ports:
      # 生产：仅本机可达，外部流量经 Nginx/Pingora 反代（§5.1 边缘层）
      - "${API_BIND:-127.0.0.1}:${FLUX_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # ZT81（2026-10-02）：改用 /ready（探 DB + Redis）。原 /health 是静态 up，
      # 依赖挂掉也报 healthy，LB 会持续导流 → 用户侧大面积 500。
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      # 备份目录（admin/backups/run 与 scripts/backup.sh 同卷；宿主 ./backups 持久化）
      - ${FLUX_BACKUP_DIR:-../backups}:/backups
      # ⚠️ 迁移目录不再挂宿主（v0.3.1 升级实测踩坑）：宿主仓库落后于镜像时，旧迁移
      # 目录会把镜像内新迁移整个遮住（镜像 270 条被宿主 268 条盖住，api 反复重启
      # 也不应用）。镜像即版本，生产/常规部署一律用镜像内置迁移；本地开发要宿主
      # 迁移先行的话叠 docker/docker-compose.dev.yml（见该文件头注释）。
      # 附件持久化（P0）：api 落盘 savedirectory=./attachments（storage.rs），不挂卷
      # 的话 compose pull && up -d 重建容器即丢全部用户附件
      - attachments:/app/attachments
    # 0224 G30：SIGTERM 排空窗口须大于 actix 默认 drain 30s（缺省 10s 会 SIGKILL
    # 掐掉在途请求——这是「其实有优雅停机却用不上」的坑）
    stop_grace_period: 45s
    restart: unless-stopped

  worker:
    image: ${FLUX_IMAGE_PREFIX:-ghcr.io/gntv456/fluxtorrent}/worker:${FLUX_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    container_name: ${FLUX_WORKER_CONTAINER:-flux-worker}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      DATABASE_URL: postgres://flux:${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}@postgres:5432/fluxtorrent
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379
      RUST_LOG: info
    # 健康探测：worker 无 HTTP 面，用进程存活 + 近期无崩溃重启判定
    healthcheck:
      test: ["NONE"]
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 迁移由 api 启动时执行（worker/tracker 自身不跑迁移）：
      # 冷启动全新卷时若 worker 先于 api 起来会因表不存在反复崩重启
      api:
        condition: service_healthy
    # 0224 G30：worker 收 SIGTERM 后停认领 + 排空在跑手动任务（≤60s，见
    # apps/worker/src/shutdown.rs），此处给 90s 窗口
    stop_grace_period: 90s
    restart: unless-stopped

  tracker:
    image: ${FLUX_IMAGE_PREFIX:-ghcr.io/gntv456/fluxtorrent}/tracker:${FLUX_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/tracker.Dockerfile
    container_name: ${FLUX_TRACKER_CONTAINER:-flux-tracker}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      TRACKER_BIND: 0.0.0.0:7070
      # UDP tracker 绑定（BEP15 connect/announce/scrape）；置空字符串禁用
      TRACKER_UDP_BIND: 0.0.0.0:6969
      # 高频请求防护：每用户/每 IP announce 限流（1/min）与 interval 兜底值（秒）
      # 阈值按保种大户口径设置（interval 1800s 时 ≈ 挂种数/30 每分钟）；用户 1800/min 覆盖 5.4 万挂种
      ANN_RATE_USER_PER_MIN: "1800"
      ANN_RATE_IP_PER_MIN: "3600"
      ANN_INTERVAL_DEFAULT: "1800"
      # 全局限流应急熔断：0=关闭；遭分布式洪水时临时设置（如 120000 = 2000r/s 总闸）
      ANN_RATE_GLOBAL_PER_MIN: "0"
      # 指标端点 /metrics：设置非空 token 后启用（抓取端带 X-Metrics-Token 头）；留空=端点返回 404
      ANN_METRICS_TOKEN: "${ANN_METRICS_TOKEN:-}"
      # tracker 挂 LB 后取 X-Forwarded-For（0225 G30-B3；与 api 侧同名 env 同口径：
      # 直连暴露时必须留空，否则客户端可伪造头绕过 IP 封禁/限流）。
      # 取的是**右数第 TRUST_PROXY_DEPTH 段**（不是首值——首值由客户端自己写）；
      # DEPTH 必须等于本站可信代理跳数，配错等于不信。
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRUST_PROXY_DEPTH: ${TRUST_PROXY_DEPTH:-1}
      # —— 以下 6 项是 10-07/10-08 两批新增的开关，此前只存在于代码默认值里：
      #    文档写了、compose 没写 ⇒ 站长既看不见也拧不动（建站产品的配置面缺口）。
      #    现在全部显式列出，默认值与代码一致，改这里即生效（无需重建镜像）。
      # 同 (账号,种子) 的周期 announce 事件合并窗比例（0 = 整条关闭）
      ANN_EVENT_MERGE_PCT: "${ANN_EVENT_MERGE_PCT:-40}"
      # 下发 interval 的稳定抖动幅度（±%，0 = 关闭）：防全站同秒重发（惊群）
      ANN_INTERVAL_JITTER_PCT: "${ANN_INTERVAL_JITTER_PCT:-10}"
      # 服务端口黑名单（逗号分隔）。留空串 = 整条关闭，只保留「拒 <1024」那一档；
      # 这里的默认值就是代码内置的那一份，写出来是为了让站长看得见能改
      ANN_BLACK_PORTS: "${ANN_BLACK_PORTS:-25,110,135,139,445,1214,1433,2049,3306,3389,4662,5432,5900,5984,6346,6347,6379,6699,8080,8081,9200,11211}"
      # scrape 独立限流档（与 announce 分桶）与单次请求的 info_hash 上限
      SCR_RATE_IP_PER_MIN: "${SCR_RATE_IP_PER_MIN:-600}"
      SCR_MAX_HASHES: "${SCR_MAX_HASHES:-64}"
      # 纯内网部署（校园网/机房内部 tracker，客户端本来就是 10.x/172.x）才放开：
      # 允许自报内网地址进 peer 表。默认关——开着它等于允许 peer 列表投毒到内网
      ALLOW_PRIVATE_PEER_IP: "${ALLOW_PRIVATE_PEER_IP:-}"
      # piece 级抽查预算（每 5min 抽查多少个 peer，0 = 只握手不传 piece）
      FLUX_TRACKER_PIECE_PROBE: "${FLUX_TRACKER_PIECE_PROBE:-8}"
      # UDP tracker 下发开关（api 侧 build_torrent_bytes 读取）：
      # 私有站 passkey 走 HTTP announce URL path；UDP 标准包不携带身份，仅对
      # 支持「URL path 填入 tracker_id」扩展约定的客户端可用。默认空 = 只发 HTTP tier；
      # 需要时设为 udp://host:6969 追加 UDP tier（客户端失败后按 BEP12 降级 HTTP）。
      TRACKER_UDP_URL: ${TRACKER_UDP_URL:-}
      # UDP 收包 worker 数（0227 G31 XL 档）：SO_REUSEPORT 多 socket 内核负载
      # 均衡；空/1 = 单循环（行为不变），大站建议 4
      TRACKER_UDP_WORKERS: ${TRACKER_UDP_WORKERS:-}
      DATABASE_URL: postgres://flux:${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}@postgres:5432/fluxtorrent
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379
      RUST_LOG: info
    ports:
      # BT 客户端直连入口，必须公网可达（与 api/web 的 127.0.0.1 收口不同，此为有意暴露）
      - "${FLUX_TRACKER_BIND:-0.0.0.0}:${FLUX_TRACKER_PORT:-7070}:7070"
      # UDP tracker（BEP15）：qBittorrent/Transmission 默认优先 UDP；TRACKER_UDP_BIND 置空可停用
      - "${FLUX_TRACKER_BIND:-0.0.0.0}:${FLUX_TRACKER_UDP_PORT:-6969}:6969/udp"
    healthcheck:
      # 镜像是 debian-slim（无 wget/curl），用 bash /dev/tcp 探测端口连通
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/127.0.0.1/7070'"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    image: ${FLUX_IMAGE_PREFIX:-ghcr.io/gntv456/fluxtorrent}/web:${FLUX_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: ${FLUX_WEB_CONTAINER:-flux-web}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      # 浏览器走同源 /api（rewrites 转发），服务端 RSC 直连容器网
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      API_SERVER_URL: http://api:8080
      # 与 api 同一口径（见上文 RSS）：前台 metadataBase / og:url / sitemap 绝对地址
      # 全靠它（0201）。缺省留空时 siteBase() 返回 null，og:url 省略、sitemap 落
      # 相对路径——不编假域名，但要绝对地址就得在这配。
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    ports:
      # WEB_BIND 默认 127.0.0.1（生产默认：公网不可达，流量走 443 反代）。
      # 冷启动例外由 quick-deploy.sh 管：首次安装期间写 WEB_BIND=0.0.0.0
      # 进 .env（外网浏览器要开 :3000/setup），脚本重跑检测向导已完成时
      # 自动删行收回——键位单一，收回即删行。
      - "${WEB_BIND:-127.0.0.1}:${FLUX_WEB_PORT:-3000}:3000"
    # 0224 G30：LB 判活依据（此前 web 是唯一无 healthcheck 的服务）。
    # 镜像 debian-slim 无 wget/curl，用 node 探（standalone 产物自带 node）
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 20s
    depends_on:
      - api
    restart: unless-stopped

  # ============ 监控栈（可选 profile：docker compose --profile monitoring up -d） ============
  # .env 配好 ANN_METRICS_TOKEN 后 api/tracker 的 /metrics 才可用（留空 = 404）。
  # Grafana 首次启动自动导入数据源 + 预置仪表盘（provisioning 目录）；
  # 告警规则在 monitoring/alerts.yml（DLQ 积压 / 5xx 率 / tracker Redis 降级 /
  # Stream 积压 / 连接池打满五条最低告警，审查报告 go-live 清单第 7 项）。

  # 注：资源限制统一在 services 各自 deploy.resources.limits（compose v2 直接生效）。

  prometheus:
    image: prom/prometheus:latest
    container_name: ${FLUX_PROM_CONTAINER:-flux-prometheus}
    profiles: ["monitoring"]
    logging: *default-logging
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:${FLUX_PROM_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ${FLUX_GRAFANA_CONTAINER:-flux-grafana}
    profiles: ["monitoring"]
    logging: *default-logging
    environment:
      # 三轮遗留（2026-10-07）：空默认回落 grafana 的 admin/admin（即使仅
      # 127.0.0.1 也不该裸奔）。compose 插值不区分 profile，无法 :? 硬失败——
      # 缺省改为高熵随机式占位（admin 无法直接登录），启用 monitoring 后
      # 请在 .env 显式设置 GRAFANA_PASSWORD 再进面板
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-flux-grafana-CHANGE-ME-9f86d081884c7d65}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${FLUX_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
    name: ${FLUX_PG_VOLUME:-docker_pgdata}
  # ZT81：Redis 计费 stream/DLQ 需要持久化（AOF 落此卷）；匿名卷会在 down -v 时丢失
  redisdata:
    name: ${FLUX_REDIS_VOLUME:-docker_redisdata}
  attachments:
    name: ${FLUX_ATTACH_VOLUME:-docker_attachments}
  prometheus-data:
    name: ${FLUX_PROM_VOLUME:-docker_prometheus-data}
  grafana-data:
    name: ${FLUX_GRAFANA_VOLUME:-docker_grafana-data}
