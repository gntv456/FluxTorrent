# 依赖安全审计：Rust CVE 扫描（§11 安全清单 cargo-audit 项）
# 无需 secrets；PR 与每周定期跑，发现已知漏洞即失败
name: security-audit

# 依赖升级 PR 唯一该跑的门（build-test/e2e-smoke 对 dependabot 让路，省下的分钟数都在这）
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        # 不加 --deny warnings：ignored advisory 会以 warning 输出，--deny 会把它也当失败
        # （2026-10-09 注：本步骤曾引用「根 audit.toml 豁免清单（h2/rsa 上游无
        # 修复）」，该文件从未入库且现已不存在——h2/rsa 两条随依赖升级不再
        # 命中，无需豁免；wasmtime 49.0.2 见 fix(deps) 提交。若将来需要豁免
        # 上游无修复的 advisory，重建 audit.toml 并在本步骤加 --file 引用。）
        run: cargo audit
