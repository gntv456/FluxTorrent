# 依赖安全审计：Rust CVE 扫描（§11 安全清单 cargo-audit 项）
# 无需 secrets；PR 与每周定期跑，发现已知漏洞即失败
name: security-audit

# 依赖升级 PR 唯一该跑的门（build-test/e2e-smoke 对 dependabot 让路，省下的分钟数都在这）
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit（豁免清单见根 audit.toml——h2/rsa 上游无修复，理由与复查条件在文件内注释）
        # 不加 --deny warnings：ignored advisory 会以 warning 输出，--deny 会把它也当失败
        run: cargo audit
