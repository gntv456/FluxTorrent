# 官方预构建镜像发布 CI（L1：用户 docker compose pull 即升级，无需本机 Rust/Node 工具链）
# 产物：ghcr.io/<owner>/<repo>/{api,worker,tracker,web}，双 tag：semver + latest
# 触发：推 semver tag（v*）时构建发布；workflow_dispatch 支持手动指定 ref。
# 说明：
# - geoip mmdb 不入仓库（.gitignore），CI 构建的 api 镜像内无 GeoLite2 文件 → GeoIP 功能静默降级（字段为 null），
#   与本地构建行为一致（apps/api/src/geo.rs 缺失时降级）。
# - arm64 跨平台构建（QEMU）对 Rust release 编译慢，故 arm64 拆到独立 job 用原生二级缓存串行构建，
#   amd64 主矩阵保持不变（v0.2.0 起双平台）。
# - web 镜像的 NEXT_PUBLIC_API_URL 在 CI 构建时为空（默认同源 /api 反代），部署时经反代路径转发即可。
# - Docker Hub 镜像同步（0276）：配置 secrets.DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后，
#   各服务多推一份 docker.io/<user>/fluxtorrent-<name>（Docker Hub 公开拉取计数，部署规模可观测）；
#   未配置时该 job 静默跳过，不影响 GHCR 主发布。
name: publish-images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: '构建的 git ref（默认当前分支头）'
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,     dockerfile: docker/api.Dockerfile }
          - { name: worker,  dockerfile: docker/worker.Dockerfile }
          - { name: tracker, dockerfile: docker/tracker.Dockerfile }
          - { name: web,     dockerfile: docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 计算版本号（v 前缀去除）
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 提取镜像名（ghcr 要求全小写）
        id: repo
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 用 provenance 附平台清单；arm64 由独立 job 追加（见 arm64-native）
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.repo.outputs.name }}:${{ steps.tags.outputs.version }}-amd64
            ${{ steps.repo.outputs.name }}:${{ steps.tags.outputs.version }}
            ${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 总结
        run: echo "已推送 ${{ steps.repo.outputs.name }} 的 ${{ steps.tags.outputs.version }} 与 latest 双 tag"

  # arm64 追加 job（v0.2.0）：QEMU 慢但在可接受范围（cache-from 复用 amd64 层无效时全量编译）。
  # 失败不阻断 amd64 发布（continue-on-error 由 needs 关系天然保证：manifest 合并 job 单独放行）。
  arm64-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,     dockerfile: docker/api.Dockerfile }
          - { name: worker,  dockerfile: docker/worker.Dockerfile }
          - { name: tracker, dockerfile: docker/tracker.Dockerfile }
          - { name: web,     dockerfile: docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 计算版本号（v 前缀去除）
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 提取镜像名（ghcr 要求全小写）
        id: repo
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.repo.outputs.name }}:${{ steps.tags.outputs.version }}-arm64
          cache-from: type=gha,scope=arm64-${{ matrix.name }}
          cache-to: type=gha,scope=arm64-${{ matrix.name }},mode=max

  # Docker Hub 同步 job（0276）：把已推到 GHCR 的同版本镜像搬运（buildx imagetools
  # 直接复制清单，不再编译一遍）。只在配了 DOCKERHUB_* 密钥时生效。
  dockerhub-sync:
    runs-on: ubuntu-latest
    needs: [manifest-merge]
    if: ${{ github.event_name == 'push' && vars.DOCKERHUB_REPO != '' && secrets.DOCKERHUB_USERNAME != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api }
          - { name: worker }
          - { name: tracker }
          - { name: web }
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 复制多架构镜像到 Docker Hub
        run: |
          V="${GITHUB_REF_NAME#v}"
          SRC="${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.name }}"
          DST="docker.io/${{ vars.DOCKERHUB_REPO }}/${{ matrix.name }}"
          docker buildx imagetools create -t "$DST:$V" -t "$DST:latest" "$SRC:$V"

  # 合并多架构 manifest：把 -amd64/-arm64 单架构 tag 收进 semver 与 latest 多架构清单
  manifest-merge:
    runs-on: ubuntu-latest
    needs: [build-push, arm64-native]
    if: always() && needs.build-push.result == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api }
          - { name: worker }
          - { name: tracker }
          - { name: web }
    steps:
      - name: 提取镜像名（ghcr 要求全小写）
        id: repo
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并多架构 manifest（arm64 失败时仅 amd64）
        run: |
          V="${GITHUB_REF_NAME#v}"
          IMG="${{ steps.repo.outputs.name }}"
          if docker manifest inspect "$IMG:$V-arm64" >/dev/null 2>&1; then
            docker manifest create "$IMG:$V" "$IMG:$V-amd64" "$IMG:$V-arm64"
            docker manifest create "$IMG:latest" "$IMG:$V-amd64" "$IMG:$V-arm64"
          else
            echo "arm64 镜像缺失（其 job 失败），manifest 仅含 amd64"
            docker manifest create "$IMG:$V" "$IMG:$V-amd64"
            docker manifest create "$IMG:latest" "$IMG:$V-amd64"
          fi
          docker manifest push "$IMG:$V"
          docker manifest push "$IMG:latest"
