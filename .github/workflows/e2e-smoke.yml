# 端到端冒烟 CI：真实 PostgreSQL + Redis 起完整 api → 种子数据 → 分层冒烟。
#
# 为什么需要（六轮测试的结论）：sqlx 是运行时查询，编译期不校验 SQL——
# 促销 SQL 冗余 bind 那类「编译绿、每个 announce 进 DLQ」的 P0 只有真库才能抓到。
# 本 workflow 是防回归的最后闸门：
#   job rust-smoke  = cargo build + 起 api（自动跑迁移）+ 逐层 HTTP 冒烟（全部只依赖
#                     schema + 引导数据，不依赖业务种子数据）
#   job migrate-idempotency = 迁移幂等（连跑两次 api 启动不报 checksum/冲突）
# 与 build-test.yml（纯编译+单测）互补，推送/PR 均触发。

name: e2e-smoke

# 这条门要起 PG+Redis、跑完整迁移链、再编 tracker/worker，是最贵的一条：
# 只在真的碰到后端/迁移/构建脚本时跑，且同一分支只留最新一次。
concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/tracker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - "scripts/**"
      - ".github/workflows/e2e-smoke.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/tracker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - "scripts/**"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

env:
  DB_PASSWORD: cipassword_32chars_for_smoke_only!
  JWT_SECRET: ci_jwt_secret_change_me_at_least_32_bytes!
  DATABASE_URL: postgres://flux:cipassword_32chars_for_smoke_only!@127.0.0.1:5432/fluxtorrent
  REDIS_URL: redis://127.0.0.1:6379
  FLUX_DEV: "1"
  BIND: 127.0.0.1:8080

jobs:
  smoke:
    # 依赖升级 PR 不需要重跑这条最贵的门（CVE 由 security-audit 把关）
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: cipassword_32chars_for_smoke_only!
          POSTGRES_DB: fluxtorrent
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        # services.command 只接受字符串（GitHub 不支持数组形式），args 用空格分隔
        # CI 网络隔离：冒烟环境不设密码（health-cmd 需无引号透传给 docker CLI）
        command: redis-server
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build api (debug)
        run: cargo build -p flux-api

      - name: Boot api #1（自动执行迁移）
        run: |
          nohup ./target/debug/flux-api > api1.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:8080/api/v1/health > /dev/null; then echo "api up"; exit 0; fi
          done
          echo "::error::api 启动失败（迁移或启动期崩溃）"; cat api1.log; exit 1

      - name: 迁移幂等（重启再跑一次迁移）
        run: |
          pkill -f target/debug/flux-api || true
          sleep 2
          nohup ./target/debug/flux-api > api2.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:8080/api/v1/health > /dev/null; then echo "api up (2nd)"; exit 0; fi
          done
          echo "::error::二次启动失败（迁移非幂等 / checksum 漂移）"; cat api2.log; exit 1

      - name: 空库装站闸门 # 生产态首启可登录 → 强制改密 → 向导完成 → 演示数据清 0
        # 这条是唯一能抓「装机链断在迁移/闸门/清理顺序里」的门：0134 注释引用尚未创建的
        # 函数、装机白名单不含改密端点、purge_demo_data 删除顺序死结，都是它先撞出来的。
        # 注：本 job 的 env.FLUX_DEV=1 只影响演示口令随机化与 CORS，闸门行为不变。
        # S8 起的断言要查库：闸门脚本在有 DATABASE_URL 时直连 service（本地走
        # docker exec flux-postgres），psql 客户端在跑闸门前就要装好。
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          python3 scripts/install_e2e.py

      - name: 引导冒烟数据（psql 客户端直连 service）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          psql "$DATABASE_URL" -t -A -c "
            INSERT INTO users (username, email, pass_hash, passkey, class_id)
            VALUES ('root', 'root@flux.local', 'stub', 'rootpasskey0000000000000000000ff', 99)
            ON CONFLICT (username) DO UPDATE
              SET passkey = EXCLUDED.passkey, class_id = EXCLUDED.class_id;"
          # announce 冒烟的 info_hash 白名单（e32e541）：伪造 hash 会被拒，
          # 引导一颗待审种（approval_status=0 允许 announce——发布者审核期要先能做种）。
          # info_hash 列是 character(40) 的十六进制文本（20 字节 → 40 个字符）；
          # repeat('41', 40) 是 80 字符必溢出，正确写法 repeat('41', 20)。
          psql "$DATABASE_URL" -t -A -c "
            INSERT INTO torrents (info_hash, name, owner_id, size, numfiles,
                                  approval_status, category_id)
            SELECT repeat('41', 20), 'ci-smoke-announce', id,
                   1024, 1, 0, (SELECT min(id) FROM categories)
              FROM users WHERE username = 'root'
            ON CONFLICT DO NOTHING;"

      - name: HTTP 冒烟（schema 驱动，不依赖种子业务数据）
        run: |
          set -e
          B=http://127.0.0.1:8080/api/v1
          fail=0
          probe() { # method path expect_code
            code=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" "$B$2" -H 'Content-Type: application/json' ${3:+-d "$3"})
            echo "$1 $2 → $code"
          }
          probe GET  /health
          # 鉴权矩阵（匿名列）：受保护资源匿名一律 401/403——任何 200 = 守卫缺失
          for path in /torrents /me /me/overview /invites /bank/overview /friends /forums /admin/overview /admin/users; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$B$path")
            echo "anon GET $path → $code"
            case "$code" in
              401|403|410|404) ;;       # 拒绝形态（含模块关闭 4101→404、setup 未就绪）
              *) echo "::error::鉴权矩阵失败：$path 匿名返回 $code（应为 401/403）"; exit 1 ;;
            esac
          done
          probe GET  /torrents                 # 未登录：信封 401（不是裸 404/500 = 路由+信封活着）
          probe GET  /compat/meta              # 公开端点
          probe GET  /auth/captcha             # 验证码签发（Redis 依赖）
          probe POST /auth/login '{"username":"root","password":"wrong"}'   # 登录路径可达（非 500）
          # 关键回归锁：促销计费 SQL（历史 P0——冗余 bind 在无数据时同样报错，真库必抓）。
          # torrents.info_hash 是 CHAR(40) NOT NULL UNIQUE——'aa' 只有 2 字符，
          # bpchar 比较会静默补白导致 UNIQUE 恒撞（首版入库成功是运气），且
          # 引导种 info_hash 已被 announce 冒烟占用 41×20；这里给独立合法 hash。
          psql "$DATABASE_URL" -t -A -c "
            INSERT INTO torrents (info_hash, raw_info_hash, pieces_hash, name, category_id, owner_id, size, numfiles, approval_status)
            VALUES (repeat('42', 20), repeat('42', 20), repeat('42', 20), 'ci-smoke', 1, 1, 1024, 1, 1) ON CONFLICT (info_hash) DO NOTHING;
            INSERT INTO promotions (scope, torrent_id, kind, starts_at, ends_at, source)
            SELECT 'torrent', id, 'free', now() - interval '1 hour', now() + interval '1 hour', 'manual'
            FROM torrents WHERE name='ci-smoke' LIMIT 1
            ON CONFLICT DO NOTHING;" > /dev/null
          # 与 worker process_event 同构的促销裁决双查询——直接验证 SQL 可解析可 bind。
          # 注意：psql 变量替换（:tid）只在 stdin/heredoc 生效，-c 里的 :tid 是字面量报
          # syntax error；且 torrent id 要动态取（库不是每次都从 1 记账）。
          # heredoc 收尾标记 <<-'SQL' 必须独占一行且顶格（YAML 里用 <<- 会吃 tab），
          # 所以 SQL 内容写进变量再管道给 psql——保持 YAML 块结构不破。
          TID="$(psql "$DATABASE_URL" -t -A -c \
            "SELECT id FROM torrents WHERE name='ci-smoke' LIMIT 1")"
          printf "SELECT kind::text FROM promotions WHERE torrent_id = :tid AND starts_at <= now() AND ends_at > now()\nORDER BY CASE kind::text WHEN 'x2free' THEN 6 WHEN 'free' THEN 3 ELSE 0 END DESC, id DESC LIMIT 1;\n" \
            | psql "$DATABASE_URL" -t -A -v tid="$TID" > /dev/null && echo "promotion SQL ok"
          echo "SMOKE DONE"

      # PT 生命线：announce → Redis Stream → worker 计费。此前只测 api，这条链路在 CI 裸奔
      # （依赖根目录手工 py 脚本）。tracker/worker 与 api 同机起，复用同一 PG/Redis。
      - name: Build tracker & worker (debug)
        run: cargo build -p flux-tracker -p flux-worker

      - name: Boot tracker & worker
        run: |
          DATABASE_URL="$DATABASE_URL" REDIS_URL="$REDIS_URL" TRACKER_BIND="0.0.0.0:7070"             nohup ./target/debug/flux-tracker > tracker.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf "http://127.0.0.1:7070/" > /dev/null 2>&1 || \
               grep -q "listening\|started\|running" tracker.log 2>/dev/null; then echo "tracker up"; break; fi
          done
          DATABASE_URL="$DATABASE_URL" REDIS_URL="$REDIS_URL"             nohup ./target/debug/flux-worker > worker.log 2>&1 &
          sleep 3
          echo "tracker/worker booted"

      - name: Announce→计费 链路冒烟
        run: |
          sudo apt-get install -y -qq redis-tools > /dev/null 2>&1 || sudo apt-get install -y -qq redis > /dev/null
          python3 scripts/ci_announce_billing_check.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: |
            api1.log
            api2.log
            tracker.log
            worker.log
          if-no-files-found: ignore
