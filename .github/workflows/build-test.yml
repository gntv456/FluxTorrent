# 构建与测试 CI：Rust 三 crate（api/worker/tracker）编译+单测，Web tsc 类型检查。
# 与 security-audit.yml 互补——此前 CI 只扫 CVE 不跑测试，40 个单测只在本地执行。
name: build-test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # 格式门禁（README 质量门禁声称项此前 CI 未跑）
      - name: Fmt
        run: cargo fmt --all --check
      - name: Check（0 error 0 warning 基线）
        run: cargo check --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      # clippy 暂以 warning 不阻断（存量代码未按 lint 全量整备）；演进为 -D warnings
      - name: Clippy（信息性）
        run: cargo clippy --workspace --all-targets || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本从根 package.json 的 packageManager 读取（与 lockfile 匹配；显式 version 会与其冲突）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # pnpm workspace：锁文件在仓库根（web 是 workspace 成员，无独立锁文件）
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: tsc 类型检查（0 错误基线）
        run: pnpm exec tsc --noEmit
      # 构建门禁（P1）：rewrites/standalone 输出/页面构建错误此前推迟到 publish-images
      # 发版构建才第一次暴露；tsc 通过不代表 next build 通过
      - name: Next build
        run: pnpm exec next build
