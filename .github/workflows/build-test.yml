# 构建与测试 CI：Rust 三 crate（api/worker/tracker）编译+单测，Web tsc 类型检查。
# 与 security-audit.yml 互补——此前 CI 只扫 CVE 不跑测试，40 个单测只在本地执行。
name: build-test

# 同一分支的重复触发只留最新。private 仓库的 Actions 分钟数是有限资源：实测
# e2e-smoke 最后一次成功是 2026-09-18，之后每条 run 都在 4~5 秒判死且无日志
# （额度/runner 层的死法），而 dependabot 的一个 PR 会同时点着三条重门。
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # 依赖升级 PR 由 security-audit 把关；重编译门留给自己的改动
  rust:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # 格式门禁（README 质量门禁声称项此前 CI 未跑）
      - name: Fmt
        run: cargo fmt --all --check
      - name: Check（0 error 0 warning 基线）
        run: cargo check --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      # clippy 暂以 warning 不阻断（存量代码未按 lint 全量整备）；演进为 -D warnings
      - name: Clippy（信息性）
        run: cargo clippy --workspace --all-targets || true

  web:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本从根 package.json 的 packageManager 读取（与 lockfile 匹配；显式 version 会与其冲突）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # pnpm workspace：锁文件在仓库根（web 是 workspace 成员，无独立锁文件）
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # lint 门禁：ESLint 9 扁平配置（next lint 已废弃）；error 阻断、warning 照报
      # （存量 warning 7 处，与 clippy 同策略：先可视化，逐步收紧为 -W error）
      - name: Lint
        run: pnpm lint
      # 行数门禁：新文件超限挂；存量超限文件只许瘦不许胖（baseline 见
      # scripts/line_limit_baseline.json；拆分后跑 --update 收缩基线）
      - name: Line limit guard
        run: node ../../scripts/line_limit_guard.mjs
      - name: tsc 类型检查（0 错误基线）
        run: pnpm exec tsc --noEmit
      # 契约漂移门禁（六维强化方案 P0-7）：errors.rs 错误码 ↔ domain-types ErrorCode、
      # promo.rs KIND_RANK ↔ PromotionKind；后端加码/改枚举而前端契约未跟 → 红灯
      - name: Type drift guard
        run: node ../../scripts/check_type_drift.mjs
      # 构建门禁（P1）：rewrites/standalone 输出/页面构建错误此前推迟到 publish-images
      # 发版构建才第一次暴露；tsc 通过不代表 next build 通过
      - name: Next build
        run: pnpm exec next build
      # i18n 防新增门禁（存量基线 i18n_baseline.json；迁移存量后跑 --update 收缩基线）
      - name: i18n guard
        run: node ../../scripts/i18n_guard.mjs
