# 构建与测试 CI：Rust 三 crate（api/worker/tracker）编译+单测，Web tsc 类型检查。
# 与 security-audit.yml 互补——此前 CI 只扫 CVE 不跑测试，40 个单测只在本地执行。
name: build-test

# 同一分支的重复触发只留最新。private 仓库的 Actions 分钟数是有限资源：实测
# e2e-smoke 最后一次成功是 2026-09-18，之后每条 run 都在 4~5 秒判死且无日志
# （额度/runner 层的死法），而 dependabot 的一个 PR 会同时点着三条重门。
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # 依赖升级 PR 由 security-audit 把关；重编译门留给自己的改动
  rust:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # 格式门禁（README 质量门禁声称项此前 CI 未跑）
      - name: Fmt
        run: cargo fmt --all --check
      - name: Check（0 error 0 warning 基线）
        run: cargo check --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      # clippy 暂以 warning 不阻断（存量代码未按 lint 全量整备）；演进为 -D warnings
      - name: Clippy（信息性）
        run: cargo clippy --workspace --all-targets || true
      # 校验详情本地化棘轮（四审 L7 第二批）：静态校验串必须进译文表、动态串条数不许涨。
      # 基线按「文本」记账（不是行号），所以搬文件/插删行不会造成假红——
      # 这是 i18n_guard 现有实现的坑，新门不再犯。
      - name: Validation i18n ratchet
        run: python3 scripts/validation_i18n_guard.py
      # SQL 串内注释门禁（2026-10-10 批七）：`//` 在 Rust 代码里是注释，
      # 粘进 SQL 字符串就成了 Postgres 的整除运算符 ⇒ 整条语句 syntax error。
      # 当日实测：种子编辑口 `PUT /torrents/{id}` 因此 100% 500。
      - name: SQL comment guard
        run: python3 scripts/sql_comment_guard.py apps
      # OpenAPI 覆盖门禁（FRAME-PLAN-01 F3 / W-49）：compat+开放两域的
      # #[utoipa::path] 注解集合 ⊇ 手写域 28 条路由——注解被误删/路径
      # 被改即红灯（产物侧另有 cargo 单测 openapi_json_covers_all_annotated_domains 双锁）。
      - name: OpenAPI coverage guard
        run: node scripts/openapi_cov_guard.mjs
      # 审计 action 命名门禁（FRAME-PLAN-01 §7 第 9 条）：新 action 必须
      # 点分层（域.动作[.对象]）；存量下划线/冒号形按 baseline 棘轮只许降。
      # 不改存量值（已写进审计链），只防新增劣化。红测：临时加
      # .audit(Some(u), "some_bad_name", None) 必须被拦。
      - name: Audit action guard
        run: node scripts/audit_action_guard.mjs

  web:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本从根 package.json 的 packageManager 读取（与 lockfile 匹配；显式 version 会与其冲突）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # pnpm workspace：锁文件在仓库根（web 是 workspace 成员，无独立锁文件）
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # lint 门禁：ESLint 9 扁平配置（next lint 已废弃）；error 阻断、warning 照报
      # （存量 warning 7 处，与 clippy 同策略：先可视化，逐步收紧为 -W error）
      - name: Lint
        run: pnpm lint
      # 行数门禁：新文件超限挂；存量超限文件只许瘦不许胖（baseline 见
      # scripts/line_limit_baseline.json；拆分后跑 --update 收缩基线）
      - name: Line limit guard
        run: node ../../scripts/line_limit_guard.mjs
      - name: tsc 类型检查（0 错误基线）
        run: pnpm exec tsc --noEmit
      # 契约漂移门禁（六维强化方案 P0-7）：errors.rs 错误码 ↔ domain-types ErrorCode、
      # promo.rs KIND_RANK ↔ PromotionKind；后端加码/改枚举而前端契约未跟 → 红灯
      - name: Type drift guard
        run: node ../../scripts/check_type_drift.mjs
      # 路由清单门禁（W-12）：actix 宏路由（裸/全限定两种形态都抓）与
      # docs/api/route-manifest.json 对账——加删路由而未刷新清单 → 红灯。
      # 修复：node scripts/route_manifest.mjs --update 后连清单一起提交。
      - name: Route manifest guard
        run: node ../../scripts/route_manifest.mjs --check
      # 分层宪法门禁（FRAME-PLAN-01 F2 / W-48）：H 路由层禁 SQL（存量按
      # scripts/layer_baseline.json 棘轮「只许瘦不许胖」）、services/ 禁
      # actix_web、domain/ 双禁——新文件零容忍，存量迁移净 SQL 后
      # `--update` 收缩基线。红测口径见脚本头注。
      - name: Layer guard
        run: node ../../scripts/layer_guard.mjs
      # 错误码注册表门禁（W-13）：errors.rs code() ↔ i18n.rs MESSAGES ↔
      # TS ErrorCode 三方对拍（check_type_drift 的全量超集），并要求
      # docs/api/error-codes.md 与源码同步（--update 刷新）。
      # 存量缺口 4102/5003 见脚本 KNOWN_GAPS 基线（WARN 不阻断）。
      - name: Error registry guard
        run: node ../../scripts/error_registry.mjs --check
      # UI 设计系统门禁（2026-10-03）：六条规则防「令牌层退化」——
      # CSS 变量引用须有定义 / 硬编码色值只减不增 / 断点只允许四档 /
      # z-index 只允许语义档 / 含动效文件须有 reduced-motion 降级 /
      # outline-none 须配 focus-visible 描边。
      # 背景：此前 eslint 只有 next/core-web-vitals、零样式规则，760 处
      # 硬编码与 47 个野断点无任何阻断能力（详见 scripts/ui_design_guard.mjs）。
      - name: UI design guard
        run: node ../../scripts/ui_design_guard.mjs
      # 设计系统覆盖率门禁（W-43）：四指标只许向好——路由加载态覆盖/
      # 原语采用率/<main> 只许升、非豁免 hex 只许降；指标恶化 → 红灯。
      - name: Design coverage guard
        run: node ../../scripts/design_cov_guard.mjs
      # 双主题对比度门禁（W-40 校准+W-43 挂 CI）：暗色套任一关键配对
      # 跌破 WCAG AA 即回潮拦截；明色套旧债（2.0-4.3）只测不调，
      # 不达标组合数比基线增多 → 红灯（防新增更差的配对）。
      - name: Theme contrast guard
        run: node ../../scripts/check_dark_contrast.mjs
      # 单源清单门禁（四审 L5/L6）：模块键 Rust key::ALL ↔ TS MODULE_KEYS ↔ DB modules；
      # 首页板块键 后端 HOME_SECTIONS ↔ 前端渲染 case。CI 无库时模块键检查跳过 DB 侧。
      # 术语规则门禁（四审 L7）额外要求每条启用中的规则至少命中一处文案——
      # CI 无库时它仍会扫源码确认机制在位（DB 侧自动跳过）。
      # prop_wiring_guard 管另一个方向：view_layout 盯「段落键存得进但页面不认」，
      # 它盯「aggregate 供得到、组件声明收得到、调用点没喂」（可选 prop 漏传不红 tsc）。
      - name: Module keys & home sections guard
        run: |
          node ../../scripts/module_keys_guard.mjs
          node ../../scripts/home_sections_guard.mjs
          node ../../scripts/view_layout_guard.mjs
          node ../../scripts/prop_wiring_guard.mjs
          node ../../scripts/terms_guard.mjs
      # 构建门禁（P1）：rewrites/standalone 输出/页面构建错误此前推迟到 publish-images
      # 发版构建才第一次暴露；tsc 通过不代表 next build 通过
      - name: Next build
        run: pnpm exec next build
      # i18n 防新增门禁（存量基线 i18n_baseline.json；迁移存量后跑 --update 收缩基线）
      - name: i18n guard
        run: node ../../scripts/i18n_guard.mjs
