[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "apps/tracker",
]
exclude = ["apps/web"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
regex = "1"
envy = "0.4"
dotenvy = "0.15"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tokio-util = "0.7"
futures-util = "0.3"
sha1 = "0.10"
dashmap = "6"
ammonia = "4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
