[workspace]
resolver = "2"
members = [
    "crates/flux-shared",
    "apps/api",
    "apps/worker",
    "apps/tracker",
]
exclude = ["apps/web"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
regex = "1"
envy = "0.4"
dotenvy = "0.15"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tokio-util = "0.7"
futures-util = "0.3"
sha1 = "0.10"
dashmap = "6"
ammonia = "4"
# F3/W-49（frame-plan §3 步③）：OpenAPI 注解化。utoipa 5.x 经 rsproxy 镜像
# 可拉取（crates.io 实查 5.0.0 存在，最新 6.0.0）；actix_extras 让
# #[utoipa::path] 的 method/path 可由 actix-web 路由宏推导，降低手抄漂移面。
utoipa = { version = "5", features = ["actix_extras"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
