[package]
name = "flux-worker"
version = "0.3.2"
edition.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio.workspace = true
serde.workspace = true
anyhow.workspace = true
serde_json.workspace = true
# 覆盖 workspace 声明：追加 mysql（np-import bin 直连 NexusPHP 源库；
# 主 bin 代码不触达 MySQL 路径，仅二进制多带一份驱动）
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "chrono", "uuid", "migrate"] }
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
redis.workspace = true
futures-util.workspace = true
sha1.workspace = true
# usage_stats 上报的站点匿名哈希（0276）
sha2 = "0.10"
# H&R 预警邮件通道（0283 P1-8）：与 api 侧 mailer 同一套 lettre feature 口径
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
url = "2"
# np-import bin（U4 §12.4）直连 NexusPHP 源库（MySQL 只读）：
# feature 并集编译——mysql 驱动只被本 bin 代码触达

[[bin]]
name = "np_import"
path = "src/bin/np_import.rs"
